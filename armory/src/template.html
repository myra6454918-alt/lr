<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<style>
/* Палитра: тёмные непрозрачные панели, светлый текст, янтарный акцент.
   Контраст текста к фону — не ниже 7:1 для основного и 4.5:1 для вторичного. */
:root{
  --bg:#121417; --panel:rgba(18,20,24,.94); --panel2:#1c1f24; --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.22);
  --tx:#f1efeb; --tx2:#b8bcc2; --tx3:#8c9197; --acc:#e8b45c; --acc2:rgba(232,180,92,.16);
  --good:#7fd08e; --bad:#f0907f; --r:10px;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--f);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100;transition:opacity .4s}
#boot.off{opacity:0;pointer-events:none}
.boot-in{display:flex;gap:12px;align-items:center;font-size:14px;color:var(--tx2)}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
body.noui .ui{display:none}

.ui{position:fixed;inset:0;pointer-events:none;z-index:10;font-size:13px;line-height:1.35}
.ui > *, .ui .bottom > *{pointer-events:auto}
.ui .bottom{pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.btn{font:600 12.5px/1 var(--f);letter-spacing:.03em;color:var(--tx);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;
  padding:0 14px;height:38px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:#262a31;border-color:rgba(255,255,255,.34)}
.btn:active{transform:translateY(1px)}
.btn.on{background:var(--acc2);border-color:var(--acc);color:#ffe2b0}
.btn.off{color:var(--tx3)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.ghost{background:transparent}
.btn.fire{background:#5a2620;border-color:#b5584b;color:#ffe3de}
.btn.fire:hover{background:#6e2f27}
.btn:focus-visible,.m-row:focus-visible,.m-opt:focus-visible{outline:2px solid #8fb6e8;outline-offset:2px}

/* левая колонка */
.col-left{position:fixed;left:16px;top:16px;width:272px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 110px)}
.card{padding:14px 16px}
.c-name{font-size:22px;font-weight:700;letter-spacing:.01em}
.c-sub{margin-top:3px;font-size:12.5px;color:var(--tx2)}
.c-spec{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.c-spec span{color:var(--tx3)} .c-spec b{color:var(--tx);font-weight:600;text-align:right}
.stats{padding:12px 14px;overflow:auto}
.s-t,.m-head span,.m-gt,.h-t{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3)}
.s-t{margin-bottom:8px}
.s-r{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px;padding:4px 0;border-top:1px solid rgba(255,255,255,.05)}
.s-r span{color:var(--tx2);font-size:12.5px}
.s-r b{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--tx)}
.s-r b small{color:var(--tx3);font-weight:500;font-size:11px}
.s-r em{font-style:normal;font-size:11.5px;margin-left:6px}
.s-r.g em{color:var(--good)} .s-r.b em{color:var(--bad)}
.s-bar{grid-column:1/-1;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.s-bar i{display:block;height:100%;background:#9aa3ad;border-radius:2px}
.s-r.g .s-bar i{background:var(--good)} .s-r.b .s-bar i{background:var(--bad)}

/* меню модификации */
.mods{position:fixed;right:16px;top:16px;bottom:84px;width:350px;display:none;flex-direction:column;overflow:hidden}
.ui.show-mods .mods{display:flex}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.m-head span{font-size:12px;color:var(--tx)}
.m-body{overflow-y:auto;padding:6px 8px 12px;flex:1;scrollbar-width:thin;scrollbar-color:#3a3f46 transparent}
.m-group{margin-top:8px}
.m-gt{padding:6px 6px 4px}
.m-row{display:grid;grid-template-columns:auto 1fr 16px;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 10px;margin:2px 0;border-radius:8px;border:1px solid transparent;background:rgba(255,255,255,.035);color:var(--tx);font:inherit;cursor:pointer}
.m-row:hover{background:rgba(255,255,255,.07);border-color:var(--line)}
.m-row.open{background:var(--acc2);border-color:rgba(232,180,92,.55)}
.m-l{font-size:12.5px;color:var(--tx2);white-space:nowrap}
.m-v{font-size:13px;font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-row.empty .m-v{color:var(--tx3);font-weight:500}
.m-c{color:var(--tx3);font-size:15px;text-align:center}
.m-opts{padding:6px 0 8px 10px;margin-left:6px;border-left:2px solid rgba(232,180,92,.35);display:flex;flex-direction:column;gap:5px}
.m-pos{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel2);border-radius:8px;border:1px solid var(--line)}
.m-pl{flex:1;color:var(--tx2);font-size:12px}
.m-pos b{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.m-opt{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font:inherit;cursor:pointer}
.m-opt:hover{border-color:var(--line2);background:#23272d}
.m-opt.on{border-color:var(--acc);background:#2a2518}
.m-opt.off{opacity:.55;cursor:not-allowed}
.o-n{font-size:13px;font-weight:600}
.o-d{margin-top:2px;font-size:11.5px;color:var(--tx2)}
.m-opt.off .o-d{color:#e7b8a8}
.o-c{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.o-c:empty{display:none}
.o-c i{font-style:normal;font-size:11px;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.07);color:var(--tx2)}
.o-c i.g{color:#a6e6b1;background:rgba(127,208,142,.13)} .o-c i.b{color:#f5b3a6;background:rgba(240,144,127,.13)}
.m-note{margin:12px 6px 0;font-size:11.5px;color:var(--tx3);line-height:1.45}

/* нижняя полоса */
.bottom{position:fixed;left:16px;right:16px;bottom:16px;display:flex;align-items:flex-end;gap:12px}
.ammo{flex:none;display:flex;align-items:center;gap:14px;padding:10px 16px;min-width:200px}
.a-n{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.a-n sup{font-size:13px;color:var(--acc);margin-left:2px;vertical-align:14px}
.a-n small{font-size:14px;color:var(--tx3);font-weight:600;margin-left:3px}
.ammo.low .a-n{color:var(--bad)}
.a-m{display:flex;flex-direction:column;gap:3px}
.a-m b{font-size:12px;letter-spacing:.08em;color:var(--acc)}
.a-m span{font-size:12px;color:var(--tx2)}
.bar{flex:1 1 auto;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px;margin:0 auto;max-width:max-content}
.mods-toggle{display:none;flex:none}
.help-btn{flex:none;width:40px;height:40px;padding:0;font-size:16px;border-radius:50%}
.help{position:fixed;right:16px;bottom:72px;padding:12px 14px;width:300px;display:none;font-size:12.5px;color:var(--tx2);line-height:1.9;z-index:12}
.help.on{display:block}
.help kbd{display:inline-block;min-width:22px;padding:0 6px;margin-right:6px;text-align:center;font:600 11px/20px var(--f);color:var(--tx);background:var(--panel2);border:1px solid var(--line2);border-radius:5px}
.h-n{margin-top:6px;font-size:11.5px;color:var(--tx3);line-height:1.5}
.ui.show-mods .help{right:382px}

.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-8px);padding:9px 16px;border-radius:8px;background:rgba(18,20,24,.96);border:1px solid var(--line2);
  font-size:13px;color:var(--tx);opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tip{position:fixed;padding:5px 9px;border-radius:6px;background:rgba(18,20,24,.96);border:1px solid var(--line2);font-size:12px;color:var(--tx);pointer-events:none;opacity:0;white-space:nowrap}
.tip.on{opacity:1}

/* режим прицеливания: убираем лишнее */
.ui.ads .col-left,.ui.ads .mods{opacity:0;pointer-events:none;transition:opacity .2s}
.ui.ads .bar .btn:not(.fire):not([data-id=ads]):not([data-id=sight]):not([data-id=mag3]):not([data-id=light]):not([data-id=laser]){display:none}
.ads-hint{position:fixed;left:50%;top:16px;transform:translateX(-50%);padding:8px 14px;border-radius:8px;background:rgba(18,20,24,.9);border:1px solid var(--line);font-size:12.5px;display:none;text-align:center}
.ads-hint.on{display:block}
.ads-hint span{display:block;margin-top:2px;color:var(--tx3);font-size:11.5px}
.scope{position:fixed;inset:0;pointer-events:none;display:none;
  background:radial-gradient(circle at 50% 50%, transparent 0, transparent calc(min(42vw,42vh) - 6px), rgba(0,0,0,.55) calc(min(42vw,42vh) - 2px), #000 min(42vw,42vh))}
.scope.on{display:block}
.nv-ov{position:fixed;inset:0;pointer-events:none;display:none;
  background:radial-gradient(circle at 50% 50%, transparent 0, transparent calc(min(40vw,40vh) - 18px), rgba(0,8,0,.7) calc(min(40vw,40vh) - 4px), #000 min(40vw,40vh))}
body.nv .nv-ov{display:block}
body.nv canvas{filter:grayscale(1) sepia(1) hue-rotate(52deg) saturate(2.6) brightness(1.1) contrast(1.2)}
.s-ret{position:absolute;left:50%;top:50%;width:calc(min(84vw,84vh));height:calc(min(84vw,84vh));transform:translate(-50%,-50%)}
.s-ret svg{width:100%;height:100%}

@media (max-width:1180px){
  .col-left{width:236px}
  .mods{width:310px}
  .ui.show-mods .help{right:342px}
}
@media (max-width:900px){
  .col-left{width:auto;right:16px;flex-direction:row;align-items:flex-start}
  .stats{display:none}
  .c-spec{display:none}
  .card{padding:10px 12px}
  .mods{top:auto;left:8px;right:8px;width:auto;bottom:124px;max-height:52vh}
  .mods-toggle{display:inline-block}
  .ui:not(.show-mods) .mods{display:none}
  .bottom{left:8px;right:8px;bottom:8px;flex-wrap:wrap}
  .ammo{min-width:0;padding:8px 12px}
  .a-n{font-size:24px}
  .bar{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;max-width:none}
  .help{right:8px;left:8px;width:auto;bottom:124px}
  .ui.show-mods .help{right:8px}
}

</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.166.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.166.1/examples/jsm/"}}</script>
</head>
<body data-weapon="{{ID}}">
<div id="app"></div>
<div id="boot"><div class="boot-in"><div class="spin"></div><span id="boot-t">Сборка модели…</span></div></div>
<script type="module">
