/** Кэш простых цветных материалов. Отдельный материал на каждый объект
    ломает слияние: две одинаковые бочки попадали бы в разные вызовы. */
const _matCache = new Map();
function cmat(color, o={}){
  const key = color+'|'+JSON.stringify(o);
  let m = _matCache.get(key);
  if(!m){
    m = new THREE.MeshStandardMaterial(Object.assign({color}, o));
    _matCache.set(key, m);
  }
  return m;
}

/* ============================================================================
   СБОРКА ГЕОМЕТРИИ
============================================================================ */
const BUCKET = new Map();
const COLLIDERS = [];
const SHOOTABLE = [];
function bucket(k){ if(!BUCKET.has(k)) BUCKET.set(k,[]); return BUCKET.get(k); }
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3();

/** UV по мировому размеру: текстура не растягивается на больших гранях. */
function uvBox(g, sx,sy,sz, d, alignGrain){
  const uv = g.attributes.uv;
  const s = [[sz,sy],[sz,sy],[sx,sz],[sx,sz],[sx,sy],[sx,sy]];
  for(let f=0; f<6; f++) for(let i=0;i<4;i++){
    const k = f*4+i;
    let u = uv.getX(k)*s[f][0]*d, v = uv.getY(k)*s[f][1]*d;
    // Текстура дерева нарисована волокном вдоль U. Если длинная сторона грани
    // идёт по V, меняем оси — иначе слои ложатся поперёк бруса.
    if(alignGrain && s[f][1] > s[f][0]){ const t=u; u=v; v=t; }
    uv.setXY(k, u, v);
  }
  uv.needsUpdate = true;
}
/** Подмешивает в геометрию вершинный цвет: каждый лист обшивки получает
    свой оттенок, иначе стена выглядит как один плоский залив. */
function tintGeo(g, r, gg, b){
  const n = g.attributes.position.count;
  const col = new Float32Array(n*3);
  for(let i=0;i<n;i++){ col[i*3]=r; col[i*3+1]=gg; col[i*3+2]=b; }
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  return g;
}
function addBox(mat, cx,cy,cz, sx,sy,sz, o={}){
  const g = new THREE.BoxGeometry(sx,sy,sz);
  uvBox(g, sx,sy,sz, o.d ?? 0.5);
  if(o.rotY || o.rotX || o.rotZ){
    _e.set(o.rotX||0, o.rotY||0, o.rotZ||0); _q.setFromEuler(_e);
  } else _q.identity();
  _m4.compose(new THREE.Vector3(cx,cy,cz), _q, new THREE.Vector3(1,1,1));
  g.applyMatrix4(_m4);
  if(o.tint) tintGeo(g, o.tint[0], o.tint[1], o.tint[2]);
  bucket(mat).push(g);
  if(o.collide !== false) addAABB(cx,cy,cz,sx,sy,sz,o.rotY||0,o.step);
  return g;
}
function addAABB(cx,cy,cz,sx,sy,sz,rotY=0,step=false){
  let ex=sx/2, ez=sz/2;
  if(rotY){ const c=Math.abs(Math.cos(rotY)), s=Math.abs(Math.sin(rotY));
            const nx=ex*c+ez*s, nz=ex*s+ez*c; ex=nx; ez=nz; }
  const c = {x0:cx-ex,y0:cy-sy/2,z0:cz-ez, x1:cx+ex,y1:cy+sy/2,z1:cz+ez};
  if(step) c.step = true;
  COLLIDERS.push(c);
  return COLLIDERS.length-1;
}
/* ---------------------------------------------------------------------------
   ЗАПЕКАНИЕ СТАТИКИ
   Карта собрана из тысяч мелких объёмов. Каждый отдельный Mesh — это вызов
   отрисовки, и их же приходится повторять в проходе теней, поэтому на слабой
   видеокарте кадр упирается не в треугольники, а в количество вызовов.
   Геометрия сливается по паре «материал + ячейка 18 м», так что вызовов
   остаётся десятки, но отсечение по пирамиде видимости продолжает работать.
--------------------------------------------------------------------------- */
const BAKE_CELL = 18;
/** Приводит список к единому виду (все индексированные либо все нет).
    Делается до подсчёта диапазонов: toNonIndexed меняет число вершин, и
    смещения, посчитанные заранее, указывали бы не туда. */
function unifyIndexing(list){
  const anyPlain = list.some(g=>!g.index);
  if(!anyPlain) return list;
  return list.map(g=>{
    if(!g.index) return g;
    const out = g.toNonIndexed();
    out.userData = g.userData;
    return out;
  });
}
/** Приводит геометрии группы к общему набору атрибутов. */
function normalizeAttrs(list, withColor){
  for(const g of list){
    for(const k of Object.keys(g.attributes))
      if(k!=='position' && k!=='normal' && k!=='uv' && k!=='color') g.deleteAttribute(k);
    if(!g.attributes.normal) g.computeVertexNormals();
    if(!g.attributes.uv){
      const n = g.attributes.position.count;
      g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n*2), 2));
    }
    if(withColor && !g.attributes.color) tintGeo(g,1,1,1);
    if(!withColor && g.attributes.color) g.deleteAttribute('color');
  }
}
function bakeGroups(entries, tag){
  // материалы, которым где-либо нужен вершинный цвет: иначе после слияния
  // часть поверхностей осталась бы без атрибута и мердж бы отвалился
  const needColor = new Set();
  for(const e of entries) if(e.geo.attributes.color) needColor.add(e.mat.uuid);
  const cells = new Map();
  const _c = new THREE.Vector3();
  for(const e of entries){
    e.geo.computeBoundingSphere();
    _c.copy(e.geo.boundingSphere.center);
    const key = e.mat.uuid+'|'+Math.floor(_c.x/BAKE_CELL)+'|'+Math.floor(_c.z/BAKE_CELL)
              +'|'+(e.cast?1:0)+(e.recv?1:0)+'|'+(e.order||0);
    let c = cells.get(key);
    if(!c){ c = {mat:e.mat, cast:e.cast, recv:e.recv, order:e.order||0, list:[]}; cells.set(key,c); }
    c.list.push(e.geo);
  }
  let made = 0;
  for(const c of cells.values()){
    const wc = needColor.has(c.mat.uuid);
    if(wc) c.mat.vertexColors = true;
    normalizeAttrs(c.list, wc);
    c.list = unifyIndexing(c.list);
    // Хрупкие куски запоминают свой диапазон вершин в общем буфере: чтобы
    // выбить панель, достаточно схлопнуть её вершины в точку — отдельный
    // меш и лишний вызов отрисовки для этого не нужны.
    let off = 0;
    const frags = [];
    for(const g of c.list){
      const n = g.attributes.position.count;
      if(g.userData && g.userData.frag) frags.push({start:off, count:n, info:g.userData.frag});
      off += n;
    }
    const merged = c.list.length === 1 ? c.list[0] : BGU.mergeGeometries(c.list, false);
    if(!merged) continue;
    // Слияние индексированных геометрий сохраняет порядок вершин, поэтому
    // посчитанные смещения остаются верными.
    merged.computeBoundingSphere();
    const mesh = new THREE.Mesh(merged, c.mat);
    mesh.castShadow = c.cast; mesh.receiveShadow = c.recv;
    mesh.renderOrder = c.order;
    mesh.name = tag;
    scene.add(mesh); SHOOTABLE.push(mesh); made++;
    for(const f of frags)
      registerFragment(mesh, f.start, f.count, f.info);
  }
  return made;
}
function flushBuckets(){
  const entries = [];
  for(const [k, arr] of BUCKET){
    for(const g of arr) entries.push({geo:g, mat:M[k], cast:true, recv:true, order:0});
    arr.length = 0;
  }
  bakeGroups(entries, 'baked_bucket');
}
/** Второй проход: сливает отдельные Mesh, добавленные в сцену напрямую
    (техника, реквизит, фермы). Всё, что двигается или разрушается, помечено
    userData.nomerge и остаётся самостоятельным объектом. */
function bakeScene(){
  const loose = [];
  scene.traverse(o=>{
    if(!o.isMesh || o.isInstancedMesh) return;
    if(o.userData.nomerge) return;
    if(o.name === 'sky' || o.name.startsWith('baked')) return;
    if(!o.geometry || !o.geometry.attributes.position) return;
    if(Array.isArray(o.material)) return;
    loose.push(o);
  });
  const entries = [];
  for(const o of loose){
    o.updateWorldMatrix(true, false);
    const g = o.geometry.clone();
    g.applyMatrix4(o.matrixWorld);
    entries.push({geo:g, mat:o.material, cast:o.castShadow, recv:o.receiveShadow,
                  order:o.renderOrder});
  }
  for(const o of loose){
    o.removeFromParent();
    const i = SHOOTABLE.indexOf(o); if(i>=0) SHOOTABLE.splice(i,1);
  }
  // Осиротевшие группы (кузова машин) больше ничего не рисуют — убираем,
  // иначе сцена тащит сотни пустых узлов через каждый обход.
  const empties = [];
  scene.traverse(o=>{ if(o.isGroup && o.children.length===0) empties.push(o); });
  for(const o of empties){
    o.removeFromParent();
    const i = SHOOTABLE.indexOf(o); if(i>=0) SHOOTABLE.splice(i,1);
  }
  return bakeGroups(entries, 'baked_loose');
}

/* ============================================================================
   АНГАР
   Кровля собирается из полос с реальными пропусками — сквозь них светит солнце.
============================================================================ */
const HW = 40, HD = 30;            // полуразмеры ангара (80 x 60 м)
const WALL_H = 5.6;                // верх бетонного цоколя + низ остекления
const EAVE = 9.2, RIDGE = 12.6;    // карниз и конёк
const roofY = z => EAVE + (RIDGE-EAVE)*(1 - Math.abs(z)/HD);
const LAMPS = [], SUNHOLES = [], WINDOWS = [];
/** Шаг колонн ангара. Из него же считаются фермы и ряды светильников. */
const COL_STEP = 7.5;
const COL_X = (()=>{
  const out = [], n = Math.floor((HW-4)/COL_STEP);
  for(let i=-n;i<=n;i++) out.push(i*COL_STEP);
  return out;
})();

function buildHangar(){
  /* --- пол: плиты 6x6 м с небольшим разбросом оттенка --- */
  const tiles = [];
  for(let i=0;i<Math.ceil(HW*2/6);i++) for(let j=0;j<Math.ceil(HD*2/6);j++){
    const x0 = -HW + i*6, z0 = -HD + j*6;
    const x1 = Math.min(x0+6, HW), z1 = Math.min(z0+6, HD);
    const g = new THREE.PlaneGeometry(x1-x0, z1-z0);
    g.rotateX(-Math.PI/2); g.translate((x0+x1)/2, 0, (z0+z1)/2);
    const uv = g.attributes.uv;
    // Случайный сдвиг И поворот UV на плиту: одинаковый тайл перестаёт читаться.
    const rot = Math.floor(srnd()*4)*Math.PI/2, cs=Math.cos(rot), sn=Math.sin(rot);
    const ou = srnd()*7, ov = srnd()*7;
    for(let k=0;k<uv.count;k++){
      const u0 = uv.getX(k)*(x1-x0)*0.42, v0 = uv.getY(k)*(z1-z0)*0.42;
      uv.setXY(k, u0*cs - v0*sn + ou, u0*sn + v0*cs + ov);
    }
    tiles.push(g);
    // деформационный шов по краю плиты
    if(x1 < HW-0.01) addBox('darker', x1, 0.004, (z0+z1)/2, 0.035, 0.03, z1-z0, {collide:false, d:1});
    if(z1 < HD-0.01) addBox('darker', (x0+x1)/2, 0.004, z1, x1-x0, 0.03, 0.035, {collide:false, d:1});
  }
  const floor = new THREE.Mesh(BGU.mergeGeometries(tiles,false), M.conc);
  floor.receiveShadow = true; floor.name='floor';
  scene.add(floor); SHOOTABLE.push(floor);
  COLLIDERS.push({x0:-HW-2,y0:-2,z0:-HD-2,x1:HW+2,y1:0,z1:HD+2});

  /* --- стены: бетонный цоколь, ленточное остекление, профлист фронтона --- */
  const GLASS_Y0 = WALL_H, GLASS_H = 2.3;
  const wallSeg = (cx,cz,sx,sz)=>{
    addBox('panel', cx, WALL_H/2, cz, sx, WALL_H, sz, {d:.30});
  };
  wallSeg(0, -HD, HW*2+0.4, .44);  wallSeg(0, HD, HW*2+0.4, .44);
  wallSeg(-HW, 0, .44, HD*2);      wallSeg( HW, 0, .44, HD*2);
  // Лента остекления — отдельные Plane без объёма: добавляем ей коллайдер,
  // иначе выше цоколя оболочка ангара дырявая.
  for(const s of [-1,1]){
    COLLIDERS.push({x0:-HW-0.3, y0:WALL_H, z0:s*HD-0.25, x1:HW+0.3, y1:EAVE, z1:s*HD+0.25});
    COLLIDERS.push({x0:s*HW-0.25, y0:WALL_H, z0:-HD-0.3, x1:s*HW+0.25, y1:EAVE, z1:HD+0.3});
  }

  // рама остекления + стёкла (длинные ленты под карнизом)
  function glazing(axis, sign){
    const along = axis==='x' ? HW : HD;
    const n = axis==='x' ? Math.round(HW*2/4.9) : Math.round(HD*2/4.9);
    for(let i=0;i<n;i++){
      const t = -along + (i+0.5)*(along*2/n);
      const wseg = (along*2/n) * 0.82;
      const px = axis==='x' ? t : sign*HW, pz = axis==='x' ? sign*HD : t;
      const yc = GLASS_Y0 + GLASS_H/2;
      const g = new THREE.PlaneGeometry(wseg, GLASS_H);
      const m = new THREE.Mesh(g, M.glass);
      m.position.set(px, yc, pz);
      m.rotation.y = axis==='x' ? (sign>0 ? Math.PI : 0) : (sign>0 ? -Math.PI/2 : Math.PI/2);
      scene.add(m);
      WINDOWS.push({pos:new THREE.Vector3(px,yc,pz), axis, sign, w:wseg, h:GLASS_H});
      // переплёт
      const inw = axis==='x' ? 0 : -sign*0.06, ind = axis==='x' ? -sign*0.06 : 0;
      const cols = 5;
      for(let k=0;k<=cols;k++){
        const off = -wseg/2 + k*wseg/cols;
        const bx = axis==='x' ? px+off : px+inw, bz = axis==='x' ? pz+ind : pz+off;
        addBox('dark', bx, yc, bz, axis==='x'?0.05:0.1, GLASS_H, axis==='x'?0.1:0.05, {collide:false, d:1});
      }
      for(const yy of [GLASS_Y0+0.02, GLASS_Y0+GLASS_H-0.02]){
        const bx = axis==='x' ? px : px+inw, bz = axis==='x' ? pz+ind : pz;
        addBox('dark', bx, yy, bz, axis==='x'?wseg:0.1, 0.07, axis==='x'?0.1:wseg, {collide:false, d:1});
      }
    }
    // сплошной профлист между остеклением и карнизом
    const topY0 = GLASS_Y0 + GLASS_H, topH = EAVE - topY0;
    if(topH > 0.1){
      if(axis==='x') addBox('corr', 0, topY0+topH/2, sign*HD, HW*2+0.4, topH, .3, {d:.45});
      else           addBox('corr', sign*HW, topY0+topH/2, 0, .3, topH, HD*2, {d:.45});
    }
  }
  glazing('x',-1); glazing('x',1); glazing('z',-1); glazing('z',1);

  // Фронтоны. Конёк идёт вдоль X, значит скат меняет высоту по Z —
  // треугольные щипцы закрывают торцы по X, а не по Z.
  for(const s of [-1,1]){
    const shape = new THREE.Shape();
    shape.moveTo(-HD, EAVE); shape.lineTo(HD, EAVE); shape.lineTo(0, RIDGE);
    const g = new THREE.ShapeGeometry(shape);
    const uv = g.attributes.uv;
    for(let i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)*0.42, uv.getY(i)*0.42);
    const m = new THREE.Mesh(g, M.corr);
    m.position.set(s*HW, 0, 0);
    m.rotation.y = s>0 ? Math.PI/2 : -Math.PI/2;
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m); SHOOTABLE.push(m);
    // стойки щипца
    for(const zz of [-HD*0.5, 0, HD*0.5]){
      const top = roofY(zz);
      if(top - EAVE < 0.15) continue;
      addBox('steel', s*HW, (EAVE+top)/2, zz, 0.2, top-EAVE, 0.14, {collide:false, d:1.2});
    }
  }
  // по торцам Z скат заканчивается на карнизе — там простой парапет
  for(const s of [-1,1]) addBox('corr', 0, EAVE+0.18, s*HD, HW*2+0.4, 0.36, 0.3, {collide:false, d:.6});

  /* --- каркас: колонны, фермы, прогоны --- */
  const colX = COL_X;
  for(const cx of colX){
    for(const cz of [-HD+0.6, HD-0.6]){
      // двутавр из трёх пластин
      addBox('steel', cx, EAVE/2, cz, 0.42, EAVE, 0.10, {d:1.1});
      addBox('steel', cx, EAVE/2, cz-0.14, 0.14, EAVE, 0.28, {collide:false, d:1.1});
      addBox('steel', cx, EAVE/2, cz+0.14, 0.14, EAVE, 0.28, {collide:false, d:1.1});
      addBox('dark', cx, 0.12, cz, 0.62, 0.24, 0.62, {d:1.2});       // база
      addBox('steel', cx, EAVE-0.5, cz + (cz<0?0.55:-0.55), 0.3, 0.9, 1.3, {collide:false, d:1});
    }
  }
  // стропильные фермы поперёк ангара
  for(const cx of colX){
    const segs = Math.round(HD*2/2.7);
    for(let i=0;i<segs;i++){
      const z0 = -HD + i*(HD*2/segs), z1 = -HD + (i+1)*(HD*2/segs);
      const y0 = roofY(z0), y1 = roofY(z1);
      // верхний пояс
      const len = Math.hypot(z1-z0, y1-y0);
      const g = new THREE.BoxGeometry(0.16, 0.20, len);
      uvBox(g, 0.16,0.2,len, 1.2);
      _e.set(Math.atan2(y1-y0, z1-z0)*-1, 0, 0); _q.setFromEuler(_e);
      _m4.compose(new THREE.Vector3(cx,(y0+y1)/2-0.12,(z0+z1)/2), _q, new THREE.Vector3(1,1,1));
      g.applyMatrix4(_m4); bucket('steel').push(g);
      // нижний пояс и раскосы
      const by = EAVE - 0.15;
      addBox('steel', cx, by, (z0+z1)/2, 0.14, 0.16, z1-z0, {collide:false, d:1.2});
      const dy = (y0+y1)/2 - 0.2 - by;
      if(dy > 0.25){
        addBox('steel', cx, by + dy/2, (z0+z1)/2, 0.09, dy, 0.09, {collide:false, d:1.2});
        const dl = Math.hypot(dy, (z1-z0));
        const gd = new THREE.BoxGeometry(0.07, 0.07, dl); uvBox(gd,0.07,0.07,dl,1.2);
        _e.set(Math.atan2(dy, z1-z0)*-1, 0, 0); _q.setFromEuler(_e);
        _m4.compose(new THREE.Vector3(cx, by+dy/2, (z0+z1)/2), _q, new THREE.Vector3(1,1,1));
        gd.applyMatrix4(_m4); bucket('steel').push(gd);
      }
    }
  }
  // продольные прогоны под кровлей
  const purlinN = Math.round(HD*2/2.1);
  for(let i=0;i<=purlinN;i++){
    const z = -HD + i*(HD*2/purlinN);
    addBox('steel', 0, roofY(z)-0.30, z, HW*2, 0.11, 0.13, {collide:false, d:1.4});
  }
  // горизонтальные связи по верху колонн
  for(const cz of [-HD+0.6, HD-0.6]) addBox('steel', 0, EAVE-0.15, cz, HW*2, 0.18, 0.14, {collide:false, d:1.4});
}

/* --- кровля: полосы профлиста с реальными пропусками под световые проёмы --- */
function buildRoof(){
  // сетка проёмов: часть закрыта поликарбонатом, часть — сквозные дыры (солнце бьёт столбом)
  const holes = [];
  const holeN = Math.round(HW*2/6);
  for(let i=0;i<holeN;i++){
    const x = -HW+4 + i*((HW*2-8)/(holeN-1)) + sr(-0.8,0.8);
    const z = (i%2 ? 1 : -1) * sr(4.5, HD-5);
    const w = sr(2.4,3.6), d = sr(1.8,2.8);
    holes.push({x, z, w, d, open: srnd() < 0.45});
  }
  // пара крупных провалов у конька — главный источник световых столбов
  holes.push({x:-6.5, z:2.0, w:4.6, d:3.4, open:true});
  holes.push({x:11.5, z:-3.5, w:4.0, d:3.0, open:true});
  holes.push({x:-24.0, z:-9.0, w:4.2, d:3.2, open:true});
  holes.push({x:25.0, z:11.0, w:4.4, d:3.2, open:true});

  const stripN = Math.round(HD*2/1.5);                // полосы вдоль X, режем по Z
  for(let i=0;i<stripN;i++){
    const z0 = -HD + i*(HD*2/stripN), z1 = -HD + (i+1)*(HD*2/stripN);
    const zc = (z0+z1)/2;
    // сегменты по X с вырезами под проёмы, пересекающие эту полосу
    let spans = [[-HW-0.3, HW+0.3]];
    for(const h of holes){
      if(zc < h.z-h.d/2 || zc > h.z+h.d/2) continue;
      const nx = [];
      for(const [a,b] of spans){
        const c0 = h.x-h.w/2, c1 = h.x+h.w/2;
        if(c1 <= a || c0 >= b){ nx.push([a,b]); continue; }
        if(a < c0) nx.push([a,c0]);
        if(c1 < b) nx.push([c1,b]);
      }
      spans = nx;
    }
    for(const [a,b] of spans){
      if(b-a < 0.12) continue;
      const y0 = roofY(z0), y1 = roofY(z1);
      const len = Math.hypot(z1-z0, y1-y0);
      const g = new THREE.PlaneGeometry(b-a, len);
      const uv = g.attributes.uv;
      for(let k=0;k<uv.count;k++) uv.setXY(k, uv.getX(k)*(b-a)*0.30, uv.getY(k)*len*0.30);
      const m = new THREE.Mesh(g, M.roof);
      m.position.set((a+b)/2, (y0+y1)/2, zc);
      m.rotation.x = -Math.PI/2 + Math.atan2(y1-y0, z1-z0);
      m.castShadow = true; m.receiveShadow = true;
      m.name = 'roofstrip';
      scene.add(m); SHOOTABLE.push(m);
    }
  }
  // конёк
  addBox('roof', 0, RIDGE+0.06, 0, HW*2+0.6, 0.12, 0.85, {collide:false, d:1.2});
  /* Кровля как преграда: полосы — плоскости без толщины, по ним AABB не
     построить. Вместо этого ставим ступенчатый «потолок» по скату, пропуская
     сквозные проёмы — через них по-прежнему можно вылететь наружу. */
  const CEIL_N = 20;
  for(let i=0;i<CEIL_N;i++){
    const za = -HD + i*(HD*2/CEIL_N), zb = -HD + (i+1)*(HD*2/CEIL_N);
    const zc = (za+zb)/2, y = roofY(zc);
    let spans = [[-HW-0.3, HW+0.3]];
    for(const h of holes){
      if(!h.open) continue;                       // застеклённые проёмы твёрдые
      if(zc < h.z-h.d/2 || zc > h.z+h.d/2) continue;
      const nx = [];
      for(const [a,b] of spans){
        const c0 = h.x-h.w/2, c1 = h.x+h.w/2;
        if(c1 <= a || c0 >= b){ nx.push([a,b]); continue; }
        if(a < c0) nx.push([a,c0]);
        if(c1 < b) nx.push([c1,b]);
      }
      spans = nx;
    }
    for(const [a,b] of spans){
      if(b-a < 0.2) continue;
      COLLIDERS.push({x0:a, y0:y-0.12, z0:za, x1:b, y1:y+0.9, z1:zb});
    }
  }
  // фронтоны и парапеты торцов: замыкают оболочку выше карниза
  for(const s of [-1,1]){
    COLLIDERS.push({x0:s*HW-0.35, y0:EAVE-0.2, z0:-HD, x1:s*HW+0.35, y1:RIDGE+0.4, z1:HD});
    COLLIDERS.push({x0:-HW, y0:EAVE-0.2, z0:s*HD-0.35, x1:HW, y1:roofY(s*HD)+0.6, z1:s*HD+0.35});
  }
  // остекление/поликарбонат в закрытых проёмах + регистрация открытых для лучей
  for(const h of holes){
    const y = roofY(h.z);
    if(!h.open){
      const g = new THREE.PlaneGeometry(h.w, h.d);
      const m = new THREE.Mesh(g, M.glass);
      m.position.set(h.x, y-0.02, h.z); m.rotation.x = -Math.PI/2;
      scene.add(m);
    }
    // обрамление проёма
    addBox('steel', h.x, y-0.08, h.z-h.d/2, h.w+0.2, 0.12, 0.12, {collide:false, d:1.2});
    addBox('steel', h.x, y-0.08, h.z+h.d/2, h.w+0.2, 0.12, 0.12, {collide:false, d:1.2});
    SUNHOLES.push({x:h.x, y, z:h.z, w:h.w, d:h.d, open:h.open});
  }
  // пара дыр в стене профлиста (пробоины, как в заброшке)
  for(let i=0;i<3;i++){
    const zz = sr(-HD+5, HD-5);
    addBox('darker', -HW+0.3, WALL_H+2.8, zz, 0.06, sr(0.6,1.4), sr(0.5,1.2), {collide:false, d:1});
  }
}

/* --- подвесные светильники --- */
/* Материалы ламп общие на всю карту: один объект материала — один вызов
   отрисовки на все сто трубок, и яркость всех ламп меняется разом. */
const LAMP_MAT = new THREE.MeshStandardMaterial({
  color:0x8e9298, emissive:0xfff4dc, emissiveIntensity:0.0, roughness:.42, metalness:.05 });
const LAMP_DEAD = new THREE.MeshStandardMaterial({color:0x6e7176, roughness:.62});
const FLICKER = [];
function setLampGlow(level){
  LAMP_MAT.emissiveIntensity = 2.6*level;
  LAMP_MAT.color.setRGB(lerp(0.44,0.92,level), lerp(0.46,0.94,level), lerp(0.49,0.96,level));
  for(const l of LAMPS) if(l.on && !l.flick) l.lit = level;
}
function buildLamps(){
  const rows = Math.round(HD*2/9), cols = Math.round(HW*2/5.5);
  for(let r=0;r<rows;r++){
    const z = -HD + 4 + r*((HD*2-8)/Math.max(1,rows-1));
    for(let i=0;i<cols;i++){
      const x = -HW + 4 + i*((HW*2-8)/Math.max(1,cols-1));
      const y = roofY(z) - 1.25;
      // корпус + отражатель
      addBox('dark', x, y+0.12, z, 1.85, 0.11, 0.30, {collide:false, d:1.4});
      const on = srnd() < 0.86 ? 1 : 0;
      // каждая двенадцатая рабочая лампа мигает — признак умирающей проводки
      const flick = on && srnd() < 0.085;
      const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.048,0.048,1.72,8),
        flick ? LAMP_MAT.clone() : (on ? LAMP_MAT : LAMP_DEAD));
      tube.rotation.z = Math.PI/2; tube.position.set(x, y, z);
      if(flick) tube.userData.nomerge = true;    // своя яркость каждый кадр
      scene.add(tube);
      // подвесы
      for(const o of [-0.7, 0.7]){
        addBox('dark', x+o, y+0.62, z, 0.035, 0.9, 0.035, {collide:false, d:1});
      }
      const rec = {pos:new THREE.Vector3(x,y-0.2,z), mesh:tube, on, flick,
                   lit:0, ph:sr(0,99), rate:sr(5.5,13.0)};
      LAMPS.push(rec);
      if(flick) FLICKER.push(rec);
    }
  }
}
/* --- ночная иллюминация: прожекторы, натриевые светильники, указатели --- */
const NIGHT_EMIS = [];              // материалы, разгорающиеся к ночи
const FLOODS = [];                  // прожекторы с настоящим световым конусом
function nightMat(color, peak=2.4){
  const m = new THREE.MeshStandardMaterial({
    color:0x2a2a2c, emissive:color, emissiveIntensity:0, roughness:.4, metalness:.1 });
  NIGHT_EMIS.push({mat:m, peak, base:new THREE.Color(color)});
  return m;
}
const MAT_SODIUM = nightMat(0xffa63c, 3.1);   // натриевый фонарь: тёплый оранжевый
const MAT_FLOOD  = nightMat(0xfff0d0, 3.6);   // галогенный прожектор
const MAT_EXIT   = nightMat(0x36d96a, 1.6);   // указатель выхода: горит всегда

/** Мачтовый прожектор: голова на кронштейне + узкий Spot вниз-внутрь.
    Spot включается только к ночи, днём он бесполезен и стоит кадра. */
function floodMast(x, z, aimX, aimZ, h=9.0){
  addBox('steel', x, h/2, z, 0.22, h, 0.22, {d:1.1});
  addBox('dark',  x, 0.16, z, 0.8, 0.32, 0.8, {d:1.2});
  // раскосы основания
  for(const a of [0, Math.PI/2, Math.PI, -Math.PI/2]){
    const g = new THREE.BoxGeometry(0.08, 1.5, 0.08);
    g.rotateX(0.42); g.rotateY(a);
    g.translate(x + Math.cos(a)*0.34, 0.8, z + Math.sin(a)*0.34);
    bucket('steel').push(g);
  }
  const dirX = aimX - x, dirZ = aimZ - z;
  const dl = Math.hypot(dirX, dirZ) || 1;
  const yaw = Math.atan2(dirX/dl, dirZ/dl);
  for(const off of [-0.44, 0.44]){
    const hx = x + Math.cos(yaw)*off + Math.sin(yaw)*0.28;
    const hz = z - Math.sin(yaw)*off + Math.cos(yaw)*0.28;
    // корпус головы
    const head = new THREE.Mesh(roundedBox(0.52,0.40,0.26,0.05,2), M.dark);
    head.position.set(hx, h-0.3, hz); head.rotation.y = yaw; head.rotation.x = 0.55;
    head.castShadow = true; scene.add(head);
    // линза: разгорается вместе с остальной ночной иллюминацией
    const lens = new THREE.Mesh(new THREE.PlaneGeometry(0.42,0.30), MAT_FLOOD);
    lens.position.set(hx + Math.sin(yaw)*0.10, h-0.42, hz + Math.cos(yaw)*0.10);
    lens.rotation.y = yaw; lens.rotation.x = 0.55 - Math.PI/2 + Math.PI/2;
    lens.rotation.x = 0.55; scene.add(lens);
  }
  const spot = new THREE.SpotLight(0xffeccd, 0, 52, 0.62, 0.55, 1.4);
  spot.position.set(x, h-0.35, z);
  spot.target.position.set(aimX, 0.4, aimZ);
  scene.add(spot); scene.add(spot.target);
  FLOODS.push({light:spot, peak: 42});
}
/** Настенный натриевый светильник-«кобра» под козырьком. */
function wallLamp(x, y, z, rotY){
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,0.44,7), M.dark);
  arm.rotation.z = Math.PI/2; arm.rotation.y = rotY;
  arm.position.set(x + Math.sin(rotY)*0.22, y, z + Math.cos(rotY)*0.22);
  scene.add(arm);
  const hood = new THREE.Mesh(new THREE.SphereGeometry(0.19, 10, 7, 0, Math.PI*2, 0, Math.PI*0.55), M.dark);
  hood.position.set(x + Math.sin(rotY)*0.46, y+0.03, z + Math.cos(rotY)*0.46);
  hood.castShadow = true; scene.add(hood);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.115, 9, 7), MAT_SODIUM);
  bulb.position.set(x + Math.sin(rotY)*0.46, y-0.06, z + Math.cos(rotY)*0.46);
  scene.add(bulb);
  LAMPS.push({pos:new THREE.Vector3(x + Math.sin(rotY)*0.5, y-0.15, z + Math.cos(rotY)*0.5),
              mesh:bulb, on:1, lit:0, warm:true});
}
/** Табличка «выход» над проёмом: единственный свет, горящий круглые сутки. */
function exitSign(x, y, z, rotY){
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.15, 0.05), M.darker);
  box.position.set(x, y, z); box.rotation.y = rotY; scene.add(box);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.30, 0.12), MAT_EXIT);
  face.position.set(x + Math.sin(rotY)*0.032, y, z + Math.cos(rotY)*0.032);
  face.rotation.y = rotY; scene.add(face);
}
function buildNightLighting(){
  // Прожекторные мачты по углам ангара: ночью они лепят длинные тени
  // от здания на бетон, и карта остаётся читаемой.
  floodMast(-HW+3.0, -HD+3.0,  -6,  -4, 9.4);
  floodMast( HW-3.0, -HD+3.0,   6,  -4, 9.4);
  floodMast(-HW+3.0,  HD-3.0,  -6,   4, 9.4);
  floodMast( HW-3.0,  HD-3.0,   6,   4, 9.4);
  // настенные светильники по периметру ангара
  for(const z of [-20, -7, 7, 20]){
    wallLamp(-HW+0.6, 4.6, z,  Math.PI/2);
    wallLamp( HW-0.6, 4.6, z, -Math.PI/2);
  }
  for(const x of [-28, -10, 10, 28]){
    wallLamp(x, 4.6, -HD+0.6, 0);
    wallLamp(x, 4.6,  HD-0.6, Math.PI);
  }
  // указатели выхода над наружными дверями здания
  const Y2 = F2+DECK_T;
  for(const d of EXT_DOORS){
    if(d.side==='n') exitSign(d.at, Y2+2.32, BZ0-0.16, Math.PI);
    else if(d.side==='s') exitSign(d.at, Y2+2.32, BZ1+0.16, 0);
    else if(d.side==='w') exitSign(BX0-0.16, Y2+2.32, d.at, -Math.PI/2);
    else exitSign(BX1+0.16, Y2+2.32, d.at, Math.PI/2);
  }
  for(const [x,z,r] of [[-14,BZ0-0.16,Math.PI], [4,BZ0-0.16,Math.PI],
                        [-9,BZ1+0.16,0], [21-19,BZ1+0.16,0]])
    exitSign(x, 2.28, z, r);
}
/** Разгорание ночной иллюминации. Вынесено из applyDaylight, чтобы
    перебор материалов шёл одним проходом. */
function setNightGlow(level){
  for(const e of NIGHT_EMIS){
    // указатель выхода питается от аккумулятора и горит всегда
    const k = e.mat === MAT_EXIT ? Math.max(0.35, level) : level;
    e.mat.emissiveIntensity = e.peak * k;
  }
  for(const f of FLOODS){
    f.light.intensity = f.peak * level;
    f.light.visible = level > 0.02;
  }
}

/** Мигание умирающих ламп: короткие провалы яркости со случайным ритмом. */
function updateFlicker(t){
  if(!FLICKER.length) return;
  for(const l of FLICKER){
    const n = Math.sin(t*l.rate + l.ph) * Math.sin(t*l.rate*0.37 + l.ph*1.7);
    const dip = n > 0.55 ? 0.08 : (n > 0.2 ? 0.55 : 1.0);
    l.lit = LAMP_LEVEL * dip;
    l.mesh.material.emissiveIntensity = 2.6 * l.lit;
  }
}

/* --- кабель-каналы, лотки и провисающие провода под фермами --- */
function buildServices(){
  for(const z of [-HD+3, -9, 9, HD-3]){
    addBox('dark', 0, EAVE-0.62, z, HW*2, 0.09, 0.26, {collide:false, d:1.4});
  }
  // провисающие кабели (кривые Безье)
  const cableMat = M.cable;
  for(let i=0;i<20;i++){
    const z = sr(-HD+2, HD-2), x0 = sr(-HW+2, 0), x1 = x0 + sr(6,18);
    const y = EAVE - sr(0.7,1.6), sag = sr(0.3,1.1);
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(x0, y, z),
      new THREE.Vector3((x0+x1)/2, y-sag, z+sr(-0.4,0.4)),
      new THREE.Vector3(x1, y, z)
    ]);
    const g = new THREE.TubeGeometry(curve, 14, sr(0.014,0.03), 5, false);
    const m = new THREE.Mesh(g, cableMat); m.castShadow = true;
    scene.add(m);
  }
  // вентиляционные короба на кровле
  for(const [x,z] of [[-18,6],[3,-10],[19,8],[-27,-14],[28,16]]){
    const y = roofY(z);
    addBox('dark', x, y+0.55, z, 1.5, 1.1, 1.5, {collide:false, d:.8});
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.85,0.85,0.12,14), M.dark);
    cap.position.set(x, y+1.16, z); scene.add(cap);
  }
}

/* ============================================================================
   КАРКАСНОЕ ЗДАНИЕ: стены, перекрытия с опорами, лестницы
============================================================================ */
const STUD=0.088, PLATE=0.088, SHEET=0.0125, STEP=0.61;
const F2 = 3.35, DECK_T = 0.22;           // отметка низа настила 2 этажа и его толщина
const H1 = F2 - 0.0, H2 = 3.05;
const WALLSEGS = [];                       // для размещения декора
let GRAF_COUNT = 0, POSTER_COUNT = 0;
const DECORSPOTS = [];
/** Габариты маршей и площадок, куда нельзя ставить ни опоры, ни реквизит.
    Заполняется в buildShootHouse и buildExternalAccess до расстановки. */
const STAIR_KEEPOUT = [];
function keepOut(x0,z0,x1,z1){
  STAIR_KEEPOUT.push({x0:Math.min(x0,x1), z0:Math.min(z0,z1),
                      x1:Math.max(x0,x1), z1:Math.max(z0,z1)});
}
function inStairway(x,z,pad=0.35){
  return STAIR_KEEPOUT.some(s => x>s.x0-pad && x<s.x1+pad && z>s.z0-pad && z<s.z1+pad);
}

function buildWall(x1,z1,x2,z2, y0,h, opt={}){
  const dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz);
  if(len < 0.05) return;
  const ang = Math.atan2(dx,dz);
  const ux=dx/len, uz=dz/len, nx=uz, nz=-ux;
  const th = opt.th ?? 0.14;
  const sheath = opt.sheath ?? 'both';
  const ops = (opt.openings||[]).slice().sort((a,b)=>a.at-b.at);
  for(const o of ops) o.y1 = Math.min(o.y1, h);
  const P = (t,n,y) => [x1+ux*t+nx*n, y, z1+uz*t+nz*n];
  const put = (t0,t1,yc,sy,mat,nOff,tk,d)=>{
    const L=t1-t0; if(L<=0.012) return;
    const [cx,cy,cz]=P(t0+L/2,nOff,yc);
    const g=new THREE.BoxGeometry(tk,sy,L); uvBox(g,tk,sy,L,d??0.5, mat==='wood');
    _e.set(0,ang,0); _q.setFromEuler(_e);
    _m4.compose(new THREE.Vector3(cx,cy,cz),_q,new THREE.Vector3(1,1,1));
    g.applyMatrix4(_m4); bucket(mat).push(g);
  };
  put(0,len,y0+PLATE/2,PLATE,'wood',0,th,.8);
  put(0,len,y0+h-PLATE/2,PLATE,'wood',0,th,.8);
  if(h>2.6) put(0,len,y0+h*0.52,0.07,'wood',0,th*0.9,.8);

  const inOp = t => ops.some(o=> t>o.at-0.1 && t<o.at+o.w+0.1 && o.y0<1.2);
  for(let t=0;t<=len+0.001;t+=STEP){
    const tt=Math.min(t,len-STUD/2);
    if(inOp(tt)) continue;
    put(tt-STUD/2,tt+STUD/2,y0+h/2,h-PLATE*2,'wood',0,th,.85);
  }
  for(const o of ops){
    put(o.at-STUD,o.at,y0+h/2,h-PLATE*2,'wood',0,th,.85);
    put(o.at+o.w,o.at+o.w+STUD,y0+h/2,h-PLATE*2,'wood',0,th,.85);
    if(o.y1 < h-0.14) put(o.at-STUD,o.at+o.w+STUD,y0+o.y1+0.07,0.14,'wood',0,th,.85);
    if(o.y0 > 0.05)   put(o.at-STUD,o.at+o.w+STUD,y0+o.y0-0.05,0.09,'wood',0,th,.85);
  }
  // обшивка вокруг проёмов
  const rects=[]; let cur=0;
  for(const o of ops){
    if(o.at-cur>0.02) rects.push([cur,o.at,0,h]);
    if(o.y0>0.02) rects.push([o.at,o.at+o.w,0,o.y0]);
    if(h-o.y1>0.02) rects.push([o.at,o.at+o.w,o.y1,h]);
    cur=o.at+o.w;
  }
  if(len-cur>0.02) rects.push([cur,len,0,h]);

  let sides = sheath==='none' ? [] : (sheath==='one' ? [opt.side??1] : [1,-1]);
  for(const [t0,t1,ry0,ry1] of rects){
    const L=t1-t0, Hh=ry1-ry0, yc=y0+(ry0+ry1)/2;
    for(const s of sides){
      const nOff=s*(th/2+SHEET/2);
      // Обшивка кладётся отдельными листами 1.22 x 2.44 м с технологическим зазором,
      // иначе стена читается как один монолитный блок.
      const SW = 1.22, SH = 2.44, GAP = 0.012;
      const cols = Math.max(1, Math.ceil(L/SW));
      const rows = Math.max(1, Math.ceil(Hh/SH));
      const cw = L/cols, ch = Hh/rows;
      for(let ci=0; ci<cols; ci++) for(let ri=0; ri<rows; ri++){
        if(opt.gaps && srnd() < opt.gaps) continue;       // недостающие листы — недострой
        const lt0 = t0 + ci*cw + GAP/2, ltW = cw - GAP;
        const ly0 = ry0 + ri*ch + GAP/2, lhH = ch - GAP;
        if(ltW < 0.05 || lhH < 0.05) continue;
        const lyc = y0 + ly0 + lhH/2;
        const [cx,cy,cz]=P(lt0+ltW/2,nOff,lyc);
        const g=new THREE.BoxGeometry(SHEET,lhH,ltW); uvBox(g,SHEET,lhH,ltW,0.82);
        _e.set(0,ang,0); _q.setFromEuler(_e);
        _m4.compose(new THREE.Vector3(cx,cy,cz),_q,new THREE.Vector3(1,1,1));
        g.applyMatrix4(_m4);
        // партии ОСП отличаются: одни листы светлее, другие серее и темнее
        const t0c = sr(0.80, 1.06), warmv = sr(0.94, 1.03);
        tintGeo(g, t0c*warmv, t0c*sr(0.97,1.01), t0c*sr(0.90,1.0));
        const matKey = srnd()<0.5 ? 'osb' : 'osb2';
        // Часть листов держится на паре гвоздей: такой лист помечается как
        // хрупкий и после запекания остаётся адресуемым диапазоном вершин.
        // Отдельным мешем его делать нельзя — это тысячи лишних вызовов.
        if(opt.frag && srnd() < opt.frag && ltW > 0.6 && lhH > 0.9){
          // Свой коллайдер на лист: выбитая панель обязана открыть проход.
          const ci = COLLIDERS.length;
          const ex = Math.abs(ux)>0.5 ? ltW/2 : 0.09, ez = Math.abs(ux)>0.5 ? 0.09 : ltW/2;
          COLLIDERS.push({x0:cx-ex, y0:lyc-lhH/2, z0:cz-ez,
                          x1:cx+ex, y1:lyc+lhH/2, z1:cz+ez, soft:true});
          g.userData = {frag:{kind:'osb', hp:2, aabb:ci}};
        }
        bucket(matKey).push(g);
        if(ltW>1.0 && lhH>1.6) DECORSPOTS.push({x:cx+nx*s*0.02, y:lyc, z:cz+nz*s*0.02,
                                             rotY:Math.atan2(nx*s,nz*s), w:ltW, h:lhH, f:y0>2?2:1});
      }
    }
    const thk=th+SHEET*2;
    const [cx,cy,cz]=P(t0+L/2,0,yc);
    const ex = Math.abs(ux)>0.5 ? L/2 : thk/2, ez = Math.abs(ux)>0.5 ? thk/2 : L/2;
    COLLIDERS.push({x0:cx-ex,y0:cy-Hh/2,z0:cz-ez,x1:cx+ex,y1:cy+Hh/2,z1:cz+ez});
  }
  // Проёмы храним вместе со стеной: декали обязаны их обходить, иначе
  // граффити ложится поперёк дверного проёма и висит в воздухе.
  WALLSEGS.push({x1,z1,x2,z2,y0,h, ops: ops.map(o=>({at:o.at, w:o.w, y0:o.y0, y1:o.y1})),
                 sheath, len});
}
/** Есть ли сплошная обшивка на участке стены [t0..t1] x [ry0..ry1]?
    Координаты — вдоль стены и от её низа. */
function wallSolid(w, t0, t1, ry0, ry1){
  if(w.sheath === 'none') return false;
  if(t0 < 0.12 || t1 > w.len - 0.12) return false;
  if(ry0 < 0.05 || ry1 > w.h - 0.05) return false;
  for(const o of (w.ops||[])){
    const oy1 = Math.min(o.y1, w.h);
    // пересечение прямоугольников: проём и пятно декали
    if(t1 > o.at - 0.12 && t0 < o.at + o.w + 0.12 &&
       ry1 > o.y0 - 0.1 && ry0 < oy1 + 0.1) return false;
  }
  return true;
}

/** Перекрытие: настил + балки + ОБЯЗАТЕЛЬНЫЕ опоры по периметру (иначе висит в воздухе). */
function deck(x0,z0,x1,z1, y=F2, opt={}){
  const sx=x1-x0, sz=z1-z0, cx=(x0+x1)/2, cz=(z0+z1)/2;
  if(sx<0.05||sz<0.05) return;
  addBox('osb', cx, y+DECK_T/2, cz, sx, DECK_T, sz, {d:.85, tint:[0.88,0.87,0.83]});
  const n = Math.max(2, Math.round(sx/STEP));
  for(let i=0;i<=n;i++){
    addBox('wood', x0+i*sx/n, y-0.14, cz, 0.075, 0.28, sz, {collide:false, d:.9});
  }
  for(const zz of [z0+0.07, z1-0.07])
    addBox('wood', cx, y-0.14, zz, sx, 0.28, 0.14, {collide:false, d:.9});
  for(const xx of [x0+0.07, x1-0.07])
    addBox('wood', xx, y-0.14, cz, 0.14, 0.28, sz, {collide:false, d:.9});
  // опорные стойки под углами и вдоль длинных сторон
  if(opt.posts !== false){
    const px = [], pz = [];
    const stepP = 3.6;
    for(let t=0;t<=sx+0.01;t+=Math.min(stepP, sx)) px.push(clamp(x0+t, x0+0.14, x1-0.14));
    for(let t=0;t<=sz+0.01;t+=Math.min(stepP, sz)) pz.push(clamp(z0+t, z0+0.14, z1-0.14));
    const seen = new Set();
    for(const X of px) for(const Z of pz){
      const edge = Math.abs(X-x0)<0.2 || Math.abs(X-x1)<0.2 || Math.abs(Z-z0)<0.2 || Math.abs(Z-z1)<0.2;
      if(!edge && !(opt.innerPosts)) continue;
      const k = X.toFixed(1)+'|'+Z.toFixed(1);
      if(seen.has(k)) continue; seen.add(k);
      // Стойка, попавшая в габарит марша, перекрывает подъём: лестница
      // проходит ровно под краем перекрытия, и столб встаёт поперёк неё.
      if(inStairway(X, Z)) continue;
      addBox('wood', X, (y-0.28)/2, Z, 0.12, y-0.28, 0.12, {d:1.0});
    }
  }
}
/** Настил с вырезами (лестничные проёмы, атриум). */
function deckHoles(x0,z0,x1,z1, holes, y=F2, opt={}){
  let rects=[[x0,z0,x1,z1]];
  for(const [hx0,hz0,hx1,hz1] of holes){
    const next=[];
    for(const [ax0,az0,ax1,az1] of rects){
      const ox0=Math.max(ax0,hx0), oz0=Math.max(az0,hz0);
      const ox1=Math.min(ax1,hx1), oz1=Math.min(az1,hz1);
      if(ox0>=ox1||oz0>=oz1){ next.push([ax0,az0,ax1,az1]); continue; }
      if(az0<oz0) next.push([ax0,az0,ax1,oz0]);
      if(oz1<az1) next.push([ax0,oz1,ax1,az1]);
      if(ax0<ox0) next.push([ax0,oz0,ox0,oz1]);
      if(ox1<ax1) next.push([ox1,oz0,ax1,oz1]);
    }
    rects=next;
  }
  for(const [a,b,c,d] of rects) deck(a,b,c,d,y,opt);
}
function railing(x1,z1,x2,z2, y=F2+DECK_T, h=1.04, opt={}){
  const len=Math.hypot(x2-x1,z2-z1); if(len<0.1) return;
  const ux=(x2-x1)/len, uz=(z2-z1)/len, ang=Math.atan2(x2-x1,z2-z1);
  const n=Math.max(1,Math.round(len/1.35));
  for(let i=0;i<=n;i++){
    const t=i*len/n;
    addBox('wood', x1+ux*t, y+h/2, z1+uz*t, 0.09,h,0.09, {collide:false, d:.95});
  }
  for(const yy of [y+h-0.045, y+h*0.52]){
    const g=new THREE.BoxGeometry(0.065,0.09,len); uvBox(g,0.065,0.09,len,.95,true);
    _e.set(0,ang,0); _q.setFromEuler(_e);
    _m4.compose(new THREE.Vector3((x1+x2)/2,yy,(z1+z2)/2),_q,new THREE.Vector3(1,1,1));
    g.applyMatrix4(_m4); bucket('wood').push(g);
  }
  if(opt.solid !== false){
    const cx=(x1+x2)/2, cz=(z1+z2)/2;
    const ex=Math.abs(ux)>0.5?len/2:0.11, ez=Math.abs(ux)>0.5?0.11:len/2;
    COLLIDERS.push({x0:cx-ex,y0:y,z0:cz-ez,x1:cx+ex,y1:y+h,z1:cz+ez});
  }
}
function stairs(x0,z0, dir, y0,y1, width=1.5, run=5.4){
  registerStair(x0,z0,dir,run,y1,width);
  const steps=Math.max(10, Math.round((y1-y0)/0.185));
  const rise=(y1-y0)/steps, tread=run/steps;
  const long = dir==='+x'||dir==='-x';
  for(let i=0;i<steps;i++){
    const t=tread*(i+0.5);
    let cx=x0, cz=z0, sx=width, sz=tread;
    if(dir==='+z') cz=z0+t; else if(dir==='-z') cz=z0-t;
    else if(dir==='+x'){ cx=x0+t; sx=tread; sz=width; }
    else { cx=x0-t; sx=tread; sz=width; }
    addBox('wood', cx, y0+rise*(i+1)-0.045, cz, sx, 0.09, sz, {d:1.1, step:true});
    addBox('osb2', cx + (dir==='+x'?-tread/2:dir==='-x'?tread/2:0), y0+rise*(i+0.5),
           cz + (dir==='+z'?-tread/2:dir==='-z'?tread/2:0),
           long?0.035:sx, rise, long?sz:0.035, {collide:false, d:.5});
  }
  for(const s of [-1,1]){
    const cx = long ? x0+(dir==='+x'?run/2:-run/2) : x0+s*width/2;
    const cz = long ? z0+s*width/2 : z0+(dir==='+z'?run/2:-run/2);
    addBox('wood', cx, (y0+y1)/2-0.24, cz, long?run:0.1, 0.36, long?0.1:run, {collide:false, d:1.1});
    // стойки перил вдоль марша
    for(let i=0;i<=3;i++){
      const t = i*run/3;
      const px = long ? x0+(dir==='+x'?t:-t) : x0+s*width/2;
      const pz = long ? z0+s*width/2 : z0+(dir==='+z'?t:-t);
      const yy = y0 + (y1-y0)*(t/run);
      addBox('wood', px, yy+0.5, pz, 0.08, 1.0, 0.08, {collide:false, d:1});
    }
  }
}

/* ============================================================================
   ПЛАНИРОВКА ЗДАНИЯ
   Здание уменьшено до 30 x 19 м: карта задумана как шут-хаус, а прежний
   корпус 38 x 24 м занимал почти весь пролёт ангара, и обойти его снаружи
   было негде. Меньший габарит освободил периметр под технику и укрытия,
   а внутри плотность комнат и простреливаемых осей только выросла.
   Anfilada: часть дверей выстроена в одну ось — длинные простреливаемые линии.
============================================================================ */
const BX0=-15, BX1=15, BZ0=-9.5, BZ1=9.5;
/** Атриум на два света по центру карты. Внутри него стоит центральная
    точка интереса — штабель контейнеров под кран-балкой. */
const ATR = {x0:-6.2, z0:-4.8, x1:6.2, z1:4.8};
/** Лестничные проёмы в перекрытии: марши внутренних лестниц. */
const STAIR_L = [-14.8,-8.4,-12.4,-2.6];
const STAIR_R = [ 12.4,-8.4, 14.8,-2.6];
/** Третья, внутренняя лестница — из южного крыла на галерею. Марш идёт
    вдоль X: поперёк южной полосы настила для него не хватает глубины,
    и верх упирался бы в перекрытие вместо того, чтобы выйти на него. */
const STAIR_C = [ -3.4, 6.4, 2.6, 8.8];
/** Входы в здание. side — грань фасада, at — координата вдоль неё,
    lvl — этаж (1 — с бетона, 2 — с наружной лестницы или моста). */
/** Проёмы фасада ставятся строго в середину пролёта между внутренними
    перегородками. Иначе стойка примыкающей стены встаёт ровно в дверь и
    проход сужается до щели, куда игрок физически не проходит. */
const EXT_DOORS = [
  {side:'n', at:-10.1, w:1.45},   // северный фасад, лестница из ангара
  {side:'n', at: 10.1, w:1.45},
  {side:'s', at: -5.6, w:1.45},
  {side:'s', at:  6.4, w:1.45},   // добавленный южный вход на галерею
  {side:'w', at:  4.0, w:1.45},
  {side:'w', at: -4.0, w:1.45},   // второй западный: крыло простреливается насквозь
  {side:'e', at:  0.0, w:1.75}    // мост из гаража: шире, под погрузку
];
/** Входы первого этажа: список для генератора крылец и разметки. */
const GROUND_DOORS = [
  {side:'n', at:-13.3}, {side:'n', at:-10.1}, {side:'n', at:-5.4},
  {side:'n', at:  0.0}, {side:'n', at:  5.4}, {side:'n', at:10.1}, {side:'n', at:13.3},
  {side:'s', at:-13.3}, {side:'s', at:-10.1}, {side:'s', at:-7.7},
  {side:'s', at: -1.0}, {side:'s', at:  5.4}, {side:'s', at:10.1}, {side:'s', at:13.3},
  {side:'w', at: -7.7}, {side:'w', at: -3.7}, {side:'w', at:  3.7}, {side:'w', at: 7.7},
  {side:'e', at: -7.7}, {side:'e', at: -3.7}, {side:'e', at:  3.7}, {side:'e', at: 7.7}
];

function buildShootHouse(){
  // Ширина дверей — 1.35 м в свету. При радиусе тела 0.34 м прежний проём
  // 1.02 м оставлял всего 34 см свободного коридора: в него можно было
  // протиснуться, но не пройти, и почти каждая комната читалась как тупик.
  const D  = (at,w=1.35)=>({at,w,y0:0,y1:2.16});     // дверь
  const Wn = (at,w=1.25)=>({at,w,y0:0.92,y1:1.96});  // окно
  const Wl = (at,w=2.1) =>({at,w,y0:0.62,y1:2.06});  // широкий проём
  const Lo = (at,w=1.0) =>({at,w,y0:1.55,y1:2.15});  // фрамуга под потолком
  const Cr = (at,w=1.1) =>({at,w,y0:0.10,y1:0.86});  // лаз у пола (пролаз ползком)
  const S  = (at,w=2.4) =>({at,w,y0:0,y1:99});       // сквозной (лестница)
  const Y2 = F2+DECK_T;
  // Наружная дверь в координатах вдоль соответствующей стены. Стены строятся
  // от (BX0,BZ0) в сторону роста координаты, поэтому смещение считается
  // от начала стены, а не от центра здания.
  const along = (side, at) => (side==='n'||side==='s') ? at-BX0 : at-BZ0;
  const extOn = (side) => EXT_DOORS.filter(d=>d.side===side).map(d=>{
    const t = along(side, d.at);
    return {at:t-d.w/2, w:d.w, y0:0, y1:2.16};
  });
  const gndOn = (side, w=1.40) => GROUND_DOORS.filter(d=>d.side===side).map(d=>{
    const t = along(side, d.at);
    return {at:t-w/2, w, y0:0, y1:2.16};
  });
  const sortOps = a => a.slice().sort((p,q)=>p.at-q.at);
  // Доля отдельно стоящих (выбиваемых) листов обшивки. Наружные стены держат
  // крепче внутренних перегородок — по ним и стреляют чаще.
  const FR_EXT = 0.16, FR_INT = 0.26;

  /* ---------- 1 ЭТАЖ ---------- */
  // наружные стены: двери, окна и низкие лазы по всем четырём фасадам
  buildWall(BX0,BZ0, BX1,BZ0, 0,H1, {gaps:.04, frag:FR_EXT,
    openings:sortOps([Wn(6.5),Wn(17.5),Cr(22.0),Wn(26.5), ...gndOn('n')])});
  buildWall(BX0,BZ1, BX1,BZ1, 0,H1, {gaps:.04, frag:FR_EXT,
    openings:sortOps([Wn(6.0),Wn(12.0),Cr(17.0),Wn(23.0),Wn(27.5), ...gndOn('s')])});
  buildWall(BX0,BZ0, BX0,BZ1, 0,H1, {gaps:.05, frag:FR_EXT,
    openings:sortOps([Wn(6.0),Wn(13.5), ...gndOn('w')])});
  buildWall(BX1,BZ0, BX1,BZ1, 0,H1, {gaps:.05, frag:FR_EXT,
    openings:sortOps([Wn(2.6),Wn(10.5),Cr(16.0), ...gndOn('e')])});

  // главный коридор: две продольные стены, двери в одну ось (анфилада).
  // Коридоры идут только в крыльях: центр занят атриумом на два света.
  // Проёмы ставятся посередине пролётов между поперечными перегородками
  // (x = -11.6, -8.6, -6.8 слева и 6.8, 8.6, 11.6 справа).
  const cz0=-1.7, cz1=1.7;
  buildWall(BX0,cz0, ATR.x0,cz0, 0,H1, {frag:FR_INT, openings:[D(1.7),D(4.9),Wn(7.4)]});
  buildWall(BX0,cz1, ATR.x0,cz1, 0,H1, {frag:FR_INT, openings:[Wn(1.7),D(4.9),Cr(7.4)]});
  buildWall(ATR.x1,cz0, BX1,cz0, 0,H1, {frag:FR_INT, openings:[D(1.4),Wn(3.9),D(7.1)]});
  buildWall(ATR.x1,cz1, BX1,cz1, 0,H1, {frag:FR_INT, openings:[D(1.4),D(3.9),Wn(7.1)]});

  // поперечные перегородки крыльев. Их длина от BZ0 до cz0 равна 7.8 м,
  // дверь ставится на 3.0 м — это середина отсека между z=-5.8 и коридором.
  for(const [i,x] of [-11.6,-8.6].entries()){
    buildWall(x,BZ0, x,cz0, 0,H1, {frag:FR_INT, openings:[D(1.6),Lo(5.4)], gaps: i===1?0.42:0.04});
    buildWall(x,cz1, x,BZ1, 0,H1, {frag:FR_INT, openings:[D(2.4),Wn(5.9)], gaps:.04});
  }
  for(const [i,x] of [8.6,11.6].entries()){
    buildWall(x,BZ0, x,cz0, 0,H1, {frag:FR_INT, openings:[D(1.6),Wn(5.4)], gaps: i===0?0.38:0.04});
    buildWall(x,cz1, x,BZ1, 0,H1, {frag:FR_INT, openings:[D(2.4),Cr(5.9)], gaps:.04});
  }
  // «комнаты в комнате» — ячейки для ближнего боя
  buildWall(BX0,-5.8, -8.6,-5.8, 0,H1, {frag:FR_INT, openings:[S(0.6,2.4), D(4.6)]});
  buildWall(BX0, 5.8, -8.6, 5.8, 0,H1, {frag:FR_INT, openings:[D(1.8), Lo(4.6)]});
  buildWall(8.6,-5.8, BX1,-5.8, 0,H1, {frag:FR_INT, openings:[D(1.5), S(3.8,2.4)]});
  buildWall(8.6, 5.8, BX1, 5.8, 0,H1, {frag:FR_INT, openings:[D(1.5), D(4.3)]});
  buildWall(-6.8,BZ0, -6.8,-5.8, 0,H1, {frag:FR_INT, openings:[D(1.4)]});
  buildWall(-6.8, 5.8, -6.8,BZ1, 0,H1, {frag:FR_INT, openings:[D(1.3)], gaps:.32});
  buildWall( 6.8,BZ0,  6.8,-5.8, 0,H1, {frag:FR_INT, openings:[D(1.4)], gaps:.28});
  buildWall( 6.8, 5.8,  6.8,BZ1, 0,H1, {frag:FR_INT, openings:[D(1.4)]});
  // добавленные тесные ячейки: короткие перегородки поперёк крыльев
  buildWall(-11.6,-5.8, -6.8,-5.8, 0,H1, {frag:FR_INT, sheath:'one', side:1, openings:[D(2.4)]});
  buildWall( 6.8, 5.8, 11.6, 5.8, 0,H1, {frag:FR_INT, sheath:'one', side:-1, openings:[D(2.4)]});
  buildWall(-3.6,BZ0, -3.6,-4.8, 0,H1, {frag:FR_INT, openings:[Cr(1.2), D(3.2)]});
  buildWall( 3.6, 4.8,  3.6,BZ1, 0,H1, {frag:FR_INT, openings:[D(2.4)], gaps:.2});

  // стены атриума: широкие проёмы, чтобы центральная точка простреливалась
  buildWall(ATR.x0,ATR.z0, ATR.x0,ATR.z1, 0,H1, {frag:FR_INT, openings:[Wl(1.6,2.0),D(6.4)]});
  buildWall(ATR.x1,ATR.z0, ATR.x1,ATR.z1, 0,H1, {frag:FR_INT, openings:[D(2.0),Wl(5.8,2.0)]});
  buildWall(ATR.x0,ATR.z0, ATR.x1,ATR.z0, 0,H1, {frag:FR_INT, openings:[D(2.4),Wl(5.6,2.2),D(9.6)]});
  buildWall(ATR.x0,ATR.z1, ATR.x1,ATR.z1, 0,H1, {frag:FR_INT, openings:[Wl(2.0,2.2),D(6.0),D(9.4)]});

  /* ---------- ПЕРЕКРЫТИЕ ---------- */
  // Габариты маршей объявляем до укладки настила: его опорные стойки
  // расставляются по сетке и иначе встают прямо поперёк лестницы.
  keepOut(-14.6,-9.6, -12.6,-2.0);      // левый марш
  keepOut( 12.6,-9.6,  14.6,-2.0);      // правый марш
  keepOut( -4.2, 6.5,   3.4, 8.7);      // южный марш вдоль X
  // Настил кладём тремя полосами: два крыла с лестничными вырезами и
  // обходные галереи вокруг пустоты атриума.
  deckHoles(BX0,BZ0, ATR.x0,BZ1, [STAIR_L], F2, {innerPosts:true});
  deckHoles(ATR.x1,BZ0, BX1,BZ1, [STAIR_R], F2, {innerPosts:true});
  deck(ATR.x0,BZ0, ATR.x1,ATR.z0, F2, {innerPosts:true});   // северная галерея
  deckHoles(ATR.x0,ATR.z1, ATR.x1,BZ1, [STAIR_C], F2, {innerPosts:true}); // южная
  // ограждения вокруг атриума и лестничных проёмов
  railing(ATR.x0,ATR.z0, ATR.x0,ATR.z1);
  railing(ATR.x1,ATR.z0, ATR.x1,ATR.z1);
  railing(ATR.x0,ATR.z0, ATR.x1,ATR.z0);
  railing(ATR.x0,ATR.z1, ATR.x1,ATR.z1);
  for(const h of [STAIR_L, STAIR_R]){
    railing(h[0],h[1], h[0],h[3]);
    railing(h[2],h[1], h[2],h[3]);
    railing(h[0],h[1], h[2],h[1]);
  }
  // южный проём: ограждаем три стороны, четвёртая — сход марша
  railing(STAIR_C[0],STAIR_C[1], STAIR_C[0],STAIR_C[3]);
  railing(STAIR_C[2],STAIR_C[1], STAIR_C[2],STAIR_C[3]);
  railing(STAIR_C[0],STAIR_C[1], STAIR_C[2],STAIR_C[1]);
  stairs(-13.6,-8.6,'+z', 0, Y2, 1.6, 5.4);
  stairs( 13.6,-8.6,'+z', 0, Y2, 1.6, 5.4);
  stairs( -3.0, 7.6,'+x', 0, Y2, 1.7, 6.0);

  /* ---------- 2 ЭТАЖ ---------- */
  // Наружные двери 2 этажа вливаются в общий список проёмов фасада.
  buildWall(BX0,BZ0, BX1,BZ0, Y2,H2, {gaps:.06, frag:FR_EXT,
    openings:sortOps([Wn(3.5),Wn(12.0),Wn(17.5),Wn(26.5), ...extOn('n')])});
  buildWall(BX0,BZ1, BX1,BZ1, Y2,H2, {gaps:.06, frag:FR_EXT,
    openings:sortOps([Wn(4.0),Wn(9.0),Wn(16.0),Wn(21.0),Wn(27.0), ...extOn('s')])});
  buildWall(BX0,BZ0, BX0,BZ1, Y2,H2, {gaps:.08, frag:FR_EXT,
    openings:sortOps([Wn(2.6),Wn(11.0), ...extOn('w')])});
  buildWall(BX1,BZ0, BX1,BZ1, Y2,H2, {gaps:.08, frag:FR_EXT,
    openings:sortOps([Wn(4.6),Wn(14.0), ...extOn('e')])});

  // коридор 2 этажа смещён относительно первого — простреливается иначе
  // Коридорные стены не доходят до лестничных проёмов: марш выходит на
  // открытую площадку. Прежде стена вставала вплотную к верху лестницы и
  // весь второй этаж за ней оказывался отрезанным.
  buildWall(-12.1,-2.2, ATR.x0,-2.2, Y2,H2, {frag:FR_INT, openings:[D(1.6),Wl(3.8)], gaps:.05});
  buildWall(-12.1, 2.2, ATR.x0, 2.2, Y2,H2, {frag:FR_INT, openings:[Wl(1.2),D(4.0)], gaps:.05});
  buildWall(ATR.x1,-2.2, 12.1,-2.2, Y2,H2, {frag:FR_INT, openings:[D(1.6),D(4.0)], gaps:.05});
  buildWall(ATR.x1, 2.2, 12.1, 2.2, Y2,H2, {frag:FR_INT, openings:[Wn(1.6),D(3.8)], gaps:.05});
  // Поперечные перегородки крыла. Стена вдоль лестничного проёма идёт
  // только до площадки, иначе марш упирается в глухой торец.
  for(const x of [-12.1,-8.8]){
    buildWall(x,BZ0, x,-2.2, Y2,H2, {frag:FR_INT, openings:[D(2.2),Lo(5.2)], gaps: x===-8.8?0.46:0.06});
    buildWall(x, 2.2, x,BZ1, Y2,H2, {frag:FR_INT, openings:[D(2.2),Wn(5.4)], gaps:.06});
  }
  for(const x of [8.8,12.1]){
    buildWall(x,BZ0, x,-2.2, Y2,H2, {frag:FR_INT, openings:[D(2.4),Wn(5.2)], gaps: x===8.8?0.42:0.06});
    buildWall(x, 2.2, x,BZ1, Y2,H2, {frag:FR_INT, openings:[D(2.0),Cr(5.4)], gaps:.06});
  }
  buildWall(BX0,-6.0, -8.8,-6.0, Y2,H2, {frag:FR_INT, openings:[S(0.7,2.4), D(4.2)]});
  buildWall(BX0, 6.0, -8.8, 6.0, Y2,H2, {frag:FR_INT, openings:[D(2.4)], gaps:.38});
  buildWall(8.8,-6.0, BX1,-6.0, Y2,H2, {frag:FR_INT, openings:[D(1.9), S(3.8,2.4)]});
  buildWall(8.8, 6.0, BX1, 6.0, Y2,H2, {frag:FR_INT, openings:[D(1.6), D(4.4)], gaps:.32});

  // парапеты вокруг атриума
  for(const [ax,az,bx,bz] of [
    [ATR.x0,ATR.z0, ATR.x0,ATR.z1], [ATR.x1,ATR.z0, ATR.x1,ATR.z1],
    [ATR.x0,ATR.z0, ATR.x1,ATR.z0], [ATR.x0,ATR.z1, ATR.x1,ATR.z1]
  ]) buildWall(ax,az, bx,bz, Y2,1.18, {openings:[]});
  buildWall(ATR.x0,BZ0, ATR.x0,ATR.z0, Y2,H2, {frag:FR_INT, openings:[D(2.0)]});
  buildWall(ATR.x1,BZ0, ATR.x1,ATR.z0, Y2,H2, {frag:FR_INT, openings:[D(2.4)]});
  buildWall(ATR.x0,ATR.z1, ATR.x0,BZ1, Y2,H2, {frag:FR_INT, openings:[D(2.2)], gaps:.28});
  buildWall(ATR.x1,ATR.z1, ATR.x1,BZ1, Y2,H2, {frag:FR_INT, openings:[D(1.9)]});

  // участки голого каркаса (недострой)
  buildWall(-3.8,-9.5, -3.8,-6.0, Y2,H2, {sheath:'none'});
  buildWall( 3.8, 6.0,  3.8, 9.5, Y2,H2, {sheath:'none'});
  buildWall(-11.6, 7.6, -6.6, 7.6, 0,H1, {sheath:'one', side:-1, frag:FR_INT, openings:[D(2.2)]});
  buildWall( 9.0,-8.2, 13.6,-8.2, Y2,H2, {sheath:'one', side:1, frag:FR_INT, openings:[D(1.9)]});
}

/* ============================================================================
   НАРУЖНЫЕ ВХОДЫ НА 2 ЭТАЖ
   Лестница с улицы (из ангара) к двери второго этажа: площадка у проёма,
   марш вдоль фасада и перила. Марш идёт вдоль стены, а не от неё —
   иначе он перекрывает проезд и заезд в гараж.
============================================================================ */
/** Стальная площадка на опорах: настил из рифлёного листа + обвязка. */
function platform(x0,z0,x1,z1,y, opt={}){
  const sx=x1-x0, sz=z1-z0, cx=(x0+x1)/2, cz=(z0+z1)/2;
  addBox('steel', cx, y-0.045, cz, sx, 0.09, sz, {d:.7});
  // обвязка по периметру
  addBox('steel', cx, y-0.18, z0+0.06, sx, 0.22, 0.12, {collide:false, d:1});
  addBox('steel', cx, y-0.18, z1-0.06, sx, 0.22, 0.12, {collide:false, d:1});
  addBox('steel', x0+0.06, y-0.18, cz, 0.12, 0.22, sz, {collide:false, d:1});
  addBox('steel', x1-0.06, y-0.18, cz, 0.12, 0.22, sz, {collide:false, d:1});
  if(opt.posts !== false){
    for(const px of [x0+0.16, x1-0.16]) for(const pz of [z0+0.16, z1-0.16]){
      addBox('steel', px, (y-0.29)/2, pz, 0.12, y-0.29, 0.12, {d:1.1});
      // косынка-раскос к стойке
      const g = new THREE.BoxGeometry(0.06, 0.9, 0.06);
      g.rotateX(0.7); g.translate(px, y*0.42, pz + (pz<cz?0.3:-0.3));
      bucket('steel').push(g);
    }
  }
}
/** Стальной марш: ступени из просечного листа на косоурах. */
function steelStairs(x0,z0, dir, y0,y1, width=1.3, run=4.6){
  registerStair(x0,z0,dir,run,y1,width);
  const steps = Math.max(8, Math.round((y1-y0)/0.185));
  const rise = (y1-y0)/steps, tread = run/steps;
  const long = dir==='+x' || dir==='-x';
  const sgn = (dir==='+x'||dir==='+z') ? 1 : -1;
  for(let i=0;i<steps;i++){
    const t = tread*(i+0.5);
    const cx = long ? x0 + sgn*t : x0;
    const cz = long ? z0 : z0 + sgn*t;
    const sx = long ? tread : width, sz = long ? width : tread;
    addBox('steel', cx, y0+rise*(i+1)-0.03, cz, sx, 0.06, sz, {d:1.4, step:true});
    // подступенок открытый — только уголок под ступенью
    addBox('steel', cx - (long?sgn*tread/2:0), y0+rise*(i+0.5)-0.09,
           cz - (long?0:sgn*tread/2), long?0.04:sx, rise*0.5, long?sz:0.04,
           {collide:false, d:1.2});
  }
  // косоуры и перила
  for(const s of [-1,1]){
    const ox = long ? 0 : s*width/2, oz = long ? s*width/2 : 0;
    const mx = long ? x0 + sgn*run/2 : x0 + ox;
    const mz = long ? z0 + oz : z0 + sgn*run/2;
    const dl = Math.hypot(run, y1-y0);
    const g = new THREE.BoxGeometry(long?dl:0.09, 0.26, long?0.09:dl);
    uvBox(g, long?dl:0.09, 0.26, long?0.09:dl, 1.1);
    // Косоур поднимается в сторону марша. Знак угла подобран так, чтобы
    // дальний по ходу конец был выше: при развороте (sgn<0) уклон меняется.
    const slope = Math.atan2(y1-y0, run);
    _e.set(long ? 0 : -slope*sgn, 0, long ? slope*sgn : 0);
    _q.setFromEuler(_e);
    _m4.compose(new THREE.Vector3(mx, (y0+y1)/2-0.19, mz), _q, new THREE.Vector3(1,1,1));
    g.applyMatrix4(_m4); bucket('steel').push(g);
    for(let i=0;i<=4;i++){
      const t = i*run/4, yy = y0 + (y1-y0)*(t/run);
      const px = long ? x0+sgn*t : x0+ox, pz = long ? z0+oz : z0+sgn*t;
      addBox('steel', px, yy+0.53, pz, 0.05, 1.06, 0.05, {collide:false, d:1});
    }
    // поручень по уклону
    const gh = new THREE.BoxGeometry(long?dl:0.055, 0.055, long?0.055:dl);
    _m4.compose(new THREE.Vector3(mx, (y0+y1)/2+1.06, mz), _q, new THREE.Vector3(1,1,1));
    gh.applyMatrix4(_m4); bucket('steel').push(gh);
  }
  // марш непроходим сбоку: тонкая стенка-ограждение вдоль обоих косоуров
  for(const s of [-1,1]){
    const cx = long ? x0 + sgn*run/2 : x0 + s*width/2;
    const cz = long ? z0 + s*width/2 : z0 + sgn*run/2;
    COLLIDERS.push({
      x0:cx-(long?run/2:0.05), y0:y0, z0:cz-(long?0.05:run/2),
      x1:cx+(long?run/2:0.05), y1:y1+1.1, z1:cz+(long?0.05:run/2)});
  }
}
/** Перила по краю площадки (без вертикальной преграды на стыке с дверью). */
function guardRail(x1,z1,x2,z2,y,h=1.08){
  const len = Math.hypot(x2-x1, z2-z1); if(len<0.1) return;
  const ux=(x2-x1)/len, uz=(z2-z1)/len, ang=Math.atan2(x2-x1, z2-z1);
  const n = Math.max(1, Math.round(len/1.2));
  for(let i=0;i<=n;i++)
    addBox('steel', x1+ux*i*len/n, y+h/2, z1+uz*i*len/n, 0.05,h,0.05, {collide:false, d:1});
  for(const yy of [y+h-0.03, y+h*0.5]){
    const g = new THREE.BoxGeometry(0.05,0.05,len);
    _e.set(0,ang,0); _q.setFromEuler(_e);
    _m4.compose(new THREE.Vector3((x1+x2)/2,yy,(z1+z2)/2),_q,new THREE.Vector3(1,1,1));
    g.applyMatrix4(_m4); bucket('steel').push(g);
  }
  // отбортовка понизу
  const gb = new THREE.BoxGeometry(0.03,0.12,len);
  _e.set(0,ang,0); _q.setFromEuler(_e);
  _m4.compose(new THREE.Vector3((x1+x2)/2,y+0.06,(z1+z2)/2),_q,new THREE.Vector3(1,1,1));
  gb.applyMatrix4(_m4); bucket('steel').push(gb);
  const cx=(x1+x2)/2, cz=(z1+z2)/2;
  const ex=Math.abs(ux)>0.5?len/2:0.07, ez=Math.abs(ux)>0.5?0.07:len/2;
  COLLIDERS.push({x0:cx-ex,y0:y,z0:cz-ez,x1:cx+ex,y1:y+h,z1:cz+ez});
}

function buildExternalAccess(){
  const Y2 = F2+DECK_T;
  const PD = 2.0, PW = 1.6;              // вынос площадки и полуширина
  const RUN = 7.2;                       // длина марша по горизонтали

  /* Марши уходят от фасада наружу, а не вдоль него: так наружная лестница
     не перекрывает двери и окна первого этажа. */
  const bay = (ax, az, nx, nz) => {
    // (nx,nz) — единичная внешняя нормаль фасада
    const px = ax + nx*PD/2, pz = az + nz*PD/2;
    // площадка у двери
    const hx = Math.abs(nx) > 0.5 ? PD/2 : PW, hz = Math.abs(nx) > 0.5 ? PW : PD/2;
    platform(px-hx, pz-hz, px+hx, pz+hz, Y2);
    // перила по бокам площадки (фасад и марш остаются открытыми)
    if(Math.abs(nx) > 0.5){
      guardRail(px-hx, pz-hz, px+hx, pz-hz, Y2);
      guardRail(px-hx, pz+hz, px+hx, pz+hz, Y2);
    } else {
      guardRail(px-hx, pz-hz, px-hx, pz+hz, Y2);
      guardRail(px+hx, pz-hz, px+hx, pz+hz, Y2);
    }
    // Марш строится снизу вверх, поэтому начинается у земли на дальнем конце
    // и поднимается обратно к площадке — иначе верх окажется на улице.
    const sx = ax + nx*(PD+RUN), sz = az + nz*(PD+RUN);
    const dir = Math.abs(nx) > 0.5 ? (nx > 0 ? '-x' : '+x') : (nz > 0 ? '-z' : '+z');
    steelStairs(sx, sz, dir, 0, Y2, 1.5, RUN);
    // промежуточная опора марша
    addBox('steel', ax + nx*(PD+RUN*0.5), Y2*0.26, az + nz*(PD+RUN*0.5),
           0.12, Y2*0.52, 0.12, {d:1.1});
  };

  for(const d of EXT_DOORS){
    if(d.side === 'n') bay(d.at, BZ0, 0, -1);
    else if(d.side === 's') bay(d.at, BZ1, 0, 1);
    else if(d.side === 'w') bay(BX0, d.at, -1, 0);
    // восточная дверь обслуживается мостом из гаража (см. buildPOI)
  }

  /* --- крыльца у дверей первого этажа --- */
  // Порог здания лежит вровень с бетоном, но у каждой двери всё равно
  // нужна площадка: она задаёт подход и разбивает голую полосу пола.
  for(const d of GROUND_DOORS){
    let px, pz, nx, nz;
    if(d.side==='n'){ px=d.at; pz=BZ0; nx=0; nz=-1; }
    else if(d.side==='s'){ px=d.at; pz=BZ1; nx=0; nz=1; }
    else if(d.side==='w'){ px=BX0; pz=d.at; nx=-1; nz=0; }
    else { px=BX1; pz=d.at; nx=1; nz=0; }
    const cx = px + nx*0.55, cz = pz + nz*0.55;
    const sx = Math.abs(nx)>0.5 ? 1.1 : 1.7, sz = Math.abs(nx)>0.5 ? 1.7 : 1.1;
    // Крыльцо под наружной лестницей ставит порог прямо на низ марша:
    // подняться после этого нельзя, поэтому такие места пропускаем.
    if(inStairway(cx, cz, 0.2)) continue;
    addBox('conc', cx, 0.055, cz, sx, 0.11, sz, {collide:false, d:.6});
    COLLIDERS.push({x0:cx-sx/2,y0:0,z0:cz-sz/2,x1:cx+sx/2,y1:0.11,z1:cz+sz/2});
    // скребок и пара гвоздей у порога — мелочь, но глаз за неё цепляется
    addBox('steel', cx + nx*0.42, 0.13, cz + nz*0.42,
           Math.abs(nx)>0.5?0.08:0.44, 0.04, Math.abs(nx)>0.5?0.44:0.08,
           {collide:false, d:1.2});
  }

  /* --- пожарная лестница на кровлю здания: четвёртый путь наверх --- */
  const fx = BX1 - 1.2, fz = BZ1 + 0.42;
  const topY = Y2 + H2 + 0.4;
  for(let i=0;i<Math.floor(topY/0.31);i++)
    addBox('steel', fx, 0.5+i*0.31, fz, 0.52, 0.045, 0.045, {collide:false, d:1});
  for(const s of [-0.24, 0.24])
    addBox('steel', fx+s, topY/2+0.25, fz, 0.06, topY-0.2, 0.06, {collide:false, d:1});
  // защитное кольцевое ограждение верхней части марша
  for(let i=0;i<7;i++){
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42,0.025,5,12,Math.PI*1.25), M.steel);
    ring.position.set(fx, topY-0.3-i*0.5, fz+0.18);
    ring.rotation.x = Math.PI/2; ring.rotation.z = Math.PI*0.375;
    scene.add(ring);
  }
  // лестница проходима: узкий вертикальный «столб» опоры под ногами
  COLLIDERS.push({x0:fx-0.3, y0:0, z0:fz-0.16, x1:fx+0.3, y1:0.52, z1:fz+0.16});

  /* --- эстакада-подмости вдоль западного фасада: обход по 2 этажу --- */
  // Эстакада прижата к самому фасаду. Раньше она выносилась на 2.4 м и
  // накрывала низ западного марша: подняться по лестнице было нельзя.
  const wx0 = BX0-1.25, wx1 = BX0-0.1;
  // Сплошная полоса вдоль фасада между двумя западными площадками.
  const wz0 = -4.0 - 1.6, wz1 = 4.0 + 1.6;
  platform(wx0, wz0, wx1, wz1, Y2, {posts:true});
  guardRail(wx0, wz0, wx0, wz1, Y2, 1.08);
  guardRail(wx0, wz0, wx1, wz0, Y2, 1.08);
  guardRail(wx0, wz1, wx1, wz1, Y2, 1.08);
}

/* ============================================================================
   СВЕТ
   Солнце — одно, с высоким разрешением тени; проёмы в кровле сами дают
   световые пятна на полу, потому что кровля отбрасывает тень.
============================================================================ */
let sun, moon, hemi, ambient, NIGHT=false;
const FILLS=[], LIGHT_POOL=[], SHAFTS=[];
let sunTarget;

function buildLights(){
  hemi = new THREE.HemisphereLight(0xaebfd0, 0x8a7e6c, 0.68); scene.add(hemi);
  ambient = new THREE.AmbientLight(0xdfe3e6, 0.16); scene.add(ambient);

  sun = new THREE.DirectionalLight(0xfff2dc, 5.4);
  sun.position.set(-46, 54, 30);
  sunTarget = new THREE.Object3D(); sunTarget.position.set(2,0,-4); scene.add(sunTarget);
  sun.target = sunTarget;
  sun.castShadow = true;
  sun.shadow.mapSize.set(Q.shadow, Q.shadow);
  const c = sun.shadow.camera;
  c.left=-58; c.right=58; c.top=50; c.bottom=-50; c.near=1; c.far=Q.shadowFar;
  sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.034;
  scene.add(sun);

  // Луна: вторая тенеобразующая заливка, включается только ночью. Своя
  // карта теней ей не нужна — лунный свет мягкий и почти без контура.
  moon = new THREE.DirectionalLight(0x9db4e0, 0.0);
  moon.position.set(38, 46, -30); moon.target = sunTarget; scene.add(moon);

  // мягкие заполняющие от остекления (без теней — дёшево)
  const f1 = new THREE.DirectionalLight(0xc6d4e6, 0.5); f1.position.set(30,14,-26); scene.add(f1);
  const f2 = new THREE.DirectionalLight(0xbcc8d8, 0.34); f2.position.set(-30,13,26); scene.add(f2);
  const f3 = new THREE.DirectionalLight(0xe8e2d4, 0.28); f3.position.set(6,24,2);   scene.add(f3);
  // отражённый от бетонного пола свет — иначе низ кровли и фермы уходят в смолу
  const bounce = new THREE.DirectionalLight(0xd4cbba, 0.55);
  bounce.position.set(0,-20,0); scene.add(bounce);
  FILLS.push(f1,f2,f3,bounce);

  for(let i=0;i<Q.lights;i++){
    const L = new THREE.PointLight(0xe6e4dc, 0, 16, 2);
    L.position.set(0,-60,0); scene.add(L); LIGHT_POOL.push(L);
  }
}

/* --- Объёмные световые столбы из проёмов кровли (аддитивные конусы) --- */
const shaftMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
  uniforms:{ uColor:{value:new THREE.Color(0xffe8c4)}, uOpacity:{value:0.055}, uTime:{value:0} },
  vertexShader:`
    varying vec3 vPos; varying vec2 vUv;
    void main(){ vUv=uv; vPos=position;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform vec3 uColor; uniform float uOpacity, uTime;
    varying vec3 vPos; varying vec2 vUv;
    void main(){
      // затухание к низу столба и к его краям
      float h = clamp(vUv.y, 0.0, 1.0);
      float fade = pow(1.0 - h, 2.1);
      // мягкие края: иначе конус читается как непрозрачная белая стена
      float edge = smoothstep(0.0, 0.46, vUv.x) * smoothstep(1.0, 0.54, vUv.x);
      edge = pow(edge, 1.6);
      float flick = 0.94 + 0.06*sin(uTime*0.6 + vPos.x*0.5);
      gl_FragColor = vec4(uColor, uOpacity*fade*edge*flick);
    }`
});
/** Столбы света из проёмов кровли. Геометрия строится единичной длины и
    разворачивается по солнцу каждый раз, когда оно сдвинулось: иначе
    к вечеру лучи продолжали бы падать отвесно, как в полдень. */
const SPOT_POOL = [];               // световые пятна на полу
const _shaftDown = new THREE.Vector3(0,-1,0);
function buildShafts(){
  // Столбы ставим у самых крупных проёмов: на слабом профиле их меньше,
  // но это именно те лучи, которые видно, а не случайная выборка.
  const keep = SUNHOLES.filter(h=>h.open)
    .sort((a,b)=> (b.w*b.d) - (a.w*a.d));
  const n = Math.max(1, Math.round(keep.length * Q.shafts));
  for(let i=0;i<Math.min(n, keep.length);i++){
    const h = keep[i];
    const r = Math.max(h.w, h.d);
    // конус единичной высоты: реальная длина задаётся масштабом по Y
    const g = new THREE.CylinderGeometry(r*0.55, r*0.86, 1, 12, 1, true);
    g.translate(0, -0.5, 0);        // вершина в начале координат — в проёме
    const m = new THREE.Mesh(g, shaftMat);
    m.position.set(h.x, h.y, h.z);
    m.renderOrder = 3;
    m.userData.baseOpacity = 0.055;
    m.userData.hole = h;
    m.userData.nomerge = true;
    scene.add(m); SHAFTS.push(m);
    // яркое пятно на полу под лучом
    const spot = new THREE.Mesh(new THREE.CircleGeometry(r*0.62, 16), SPOT_MAT);
    spot.rotation.x = -Math.PI/2; spot.position.set(h.x, 0.012, h.z);
    spot.renderOrder = 3; spot.userData.nomerge = true;
    scene.add(spot); SPOT_POOL.push({mesh:spot, hole:h, r});
  }
  updateShafts();
}
const SPOT_MAT = new THREE.MeshBasicMaterial({color:0xffeccd, transparent:true,
  opacity:0.055, blending:THREE.AdditiveBlending, depthWrite:false});
const _shaftQ = new THREE.Quaternion(), _shaftDir = new THREE.Vector3();
function updateShafts(){
  // Направление распространения света: от солнца вниз.
  _shaftDir.copy(SUN_DIR).negate();
  const down = Math.max(0.12, -_shaftDir.y);
  _shaftQ.setFromUnitVectors(_shaftDown, _shaftDir);
  for(const m of SHAFTS){
    const h = m.userData.hole; if(!h) continue;
    const len = clamp(h.y/down, 1, 46);
    m.quaternion.copy(_shaftQ);
    m.scale.set(1, len, 1);
  }
  for(const s of SPOT_POOL){
    const len = s.hole.y/down;
    // пятно уезжает по полу вслед за солнцем и растягивается к закату
    s.mesh.position.set(s.hole.x + _shaftDir.x*len, 0.012, s.hole.z + _shaftDir.z*len);
    const stretch = clamp(1/down, 1, 4.2);
    s.mesh.scale.set(1, stretch, 1);
    s.mesh.rotation.z = Math.atan2(_shaftDir.x, _shaftDir.z);
    const inside = Math.abs(s.mesh.position.x) < HW && Math.abs(s.mesh.position.z) < HD;
    s.mesh.visible = inside;
  }
}
/* --- Пыль в воздухе: точки, подсвеченные в лучах --- */
let dust;
function buildDust(){
  const N = Q.dust;
  const pos = new Float32Array(N*3), rndv = new Float32Array(N);
  for(let i=0;i<N;i++){
    pos[i*3]   = sr(-HW+1, HW-1);
    pos[i*3+1] = sr(0.2, EAVE-0.5);
    pos[i*3+2] = sr(-HD+1, HD-1);
    rndv[i] = srnd();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aRnd', new THREE.BufferAttribute(rndv,1));
  const m = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ uTime:{value:0}, uSize:{value:1.15}, uOpacity:{value:0.5},
               uPixelRatio:{value:renderer.getPixelRatio()} },
    vertexShader:`
      attribute float aRnd; uniform float uTime,uSize,uPixelRatio;
      varying float vA;
      void main(){
        vec3 p = position;
        // медленный дрейф по воздуху
        p.x += sin(uTime*0.10 + aRnd*31.4)*0.55;
        p.y += sin(uTime*0.07 + aRnd*17.7)*0.35;
        p.z += cos(uTime*0.09 + aRnd*23.1)*0.55;
        vec4 mv = modelViewMatrix*vec4(p,1.0);
        gl_Position = projectionMatrix*mv;
        gl_PointSize = clamp(uSize*uPixelRatio*(9.0/max(-mv.z,1.0)), 0.6, 3.2);
        // ближе к свету сверху — ярче
        vA = (0.30 + 0.70*aRnd) * smoothstep(0.0,3.0,p.y);
      }`,
    fragmentShader:`
      uniform float uOpacity; varying float vA;
      void main(){
        vec2 d = gl_PointCoord - 0.5;
        float a = smoothstep(0.5, 0.06, length(d));
        gl_FragColor = vec4(vec3(1.0,0.95,0.86), a*vA*uOpacity);
      }`
  });
  dust = new THREE.Points(g, m);
  dust.frustumCulled = false;
  scene.add(dust);
}
function updateLightPool(pos){
  if(!LAMPS.length) return;
  LAMPS.forEach(l => l.d = (l.pos.x-pos.x)**2 + (l.pos.z-pos.z)**2);
  const near = LAMPS.filter(l=>l.on && l.lit > 0.02).sort((a,b)=>a.d-b.d).slice(0, LIGHT_POOL.length);
  const power = lerp(2.4, 8.2, LAMP_LEVEL);
  near.forEach((l,i)=>{
    const L = LIGHT_POOL[i];
    L.position.copy(l.pos);
    L.intensity = power * l.lit * clamp(1 - Math.sqrt(l.d)/24, 0, 1);
  });
  for(let i=near.length;i<LIGHT_POOL.length;i++) LIGHT_POOL[i].intensity = 0;
}

/* ---------------------------------------------------------------------------
   СУТОЧНЫЙ ЦИКЛ
   Время идёт само: сцена открывается ясным днём, затем вечер, закат, сумерки,
   ночь с фонарями, рассвет — и снова день. Всё освещение (солнце, луна,
   небо, туман, лампы, экспозиция) — функции одного параметра t ∈ [0,1).
--------------------------------------------------------------------------- */
/** Ключевые кадры цикла. t — доля суток, 0.25 — полдень, 0.75 — полночь. */
const DAY_KEYS = [
  // t,    sunI, sunColor, hemiSky,  hemiGnd,  amb,  skyTop,   skyMid,   skyBot,   fogCol,   fogD,    exposure, lamp

  [0.25, 5.60, 0xfff4e2, 0xaebfd0, 0x8a7e6c, 0.18, 0x6f96c4, 0xc8d4e0, 0xa39a8c, 0xa2a8ad, 0.0044, 1.00, 0.00], // полдень
  [0.42, 4.60, 0xffe7c2, 0xa8bcd0, 0x8a7a64, 0.18, 0x6a8fbe, 0xc9d0d8, 0x9e9486, 0x9ea2a4, 0.0050, 1.04, 0.05], // день
  [0.52, 2.60, 0xffc184, 0x9aa8c0, 0x8a7458, 0.17, 0x50719e, 0xd9ab7a, 0x8d7c68, 0x9a8c7c, 0.0068, 1.14, 0.35], // вечер
  [0.60, 1.05, 0xff8a4e, 0x87799a, 0x7a5c44, 0.15, 0x3c5286, 0xe07a44, 0x7c5a48, 0x8e6a52, 0.0092, 1.26, 0.72], // закат
  [0.66, 0.26, 0xd2663c, 0x5d5f86, 0x53463c, 0.12, 0x26355e, 0x9a5442, 0x51413c, 0x5c4a44, 0.0112, 1.34, 0.92], // гражданские сумерки
  [0.72, 0.03, 0x50607e, 0x2c3350, 0x241f22, 0.07, 0x0d1430, 0x22294a, 0x1d1c22, 0x1a1e2c, 0.0128, 1.42, 1.00], // сумерки
  [0.80, 0.00, 0x28344e, 0x18203a, 0x14121a, 0.05, 0x050a1c, 0x0d1430, 0x121118, 0x0a0d16, 0.0138, 1.46, 1.00], // ночь
  [0.90, 0.00, 0x28344e, 0x1a2340, 0x14121a, 0.05, 0x060b1e, 0x101838, 0x131219, 0x0c0f18, 0.0134, 1.44, 1.00], // глубокая ночь
  [0.96, 0.22, 0x8a6a72, 0x3d4464, 0x322a2c, 0.10, 0x18224a, 0x4a4468, 0x2e2a2e, 0x2e3042, 0.0118, 1.36, 0.95], // предрассветные
  [1.00, 0.55, 0xffb489, 0x7d92b4, 0x6d6354, 0.16, 0x37527e, 0xd8a074, 0x7a6a5e, 0x8e8074, 0.0090, 1.22, 0.55]
];
const PHASE_NAMES = [
  [0.045,'РАССВЕТ'], [0.17,'УТРО'], [0.34,'ПОЛДЕНЬ'], [0.47,'ДЕНЬ'],
  [0.56,'ВЕЧЕР'], [0.635,'ЗАКАТ'], [0.70,'СУМЕРКИ'], [0.755,'НОЧЬ'],
  [0.935,'ГЛУБОКАЯ НОЧЬ'], [0.985,'ПРЕДРАССВЕТНЫЕ СУМЕРКИ'], [1.01,'РАССВЕТ']
];
/** Карта открывается днём, дальше время идёт вперёд: вечер → закат → ночь. */
let DAY_T = 0.26;
let DAY_SPEED = 1/300;          // полные сутки за 5 минут реального времени
let DAY_PAUSED = false;
let LAMP_LEVEL = 0;             // 0 — фонари выключены, 1 — горят в полную
const _kc = new THREE.Color(), _kc2 = new THREE.Color();
const SUN_DIR = new THREE.Vector3(0,1,0);
const MOON_DIR = new THREE.Vector3(0,-1,0);
let SUN_ELEV = 1;

/** Линейная выборка из таблицы ключей с интерполяцией цветов в sRGB. */
function sampleDay(t){
  t = ((t % 1) + 1) % 1;
  let i = 0;
  while(i < DAY_KEYS.length-2 && DAY_KEYS[i+1][0] <= t) i++;
  const a = DAY_KEYS[i], b = DAY_KEYS[i+1];
  const k = clamp((t - a[0]) / Math.max(1e-6, b[0]-a[0]), 0, 1);
  // сглаживание перехода: линейный стык между ключами даёт заметный излом
  const s = k*k*(3-2*k);
  const mixCol = (ca, cb, out)=>{
    out.setHex(ca, THREE.SRGBColorSpace);
    _kc2.setHex(cb, THREE.SRGBColorSpace);
    return out.lerp(_kc2, s);
  };
  return {
    sunI: lerp(a[1], b[1], s),
    sunCol: mixCol(a[2], b[2], new THREE.Color()),
    hemiSky: mixCol(a[3], b[3], new THREE.Color()),
    hemiGnd: mixCol(a[4], b[4], new THREE.Color()),
    amb: lerp(a[5], b[5], s),
    skyTop: mixCol(a[6], b[6], new THREE.Color()),
    skyMid: mixCol(a[7], b[7], new THREE.Color()),
    skyBot: mixCol(a[8], b[8], new THREE.Color()),
    fogCol: mixCol(a[9], b[9], new THREE.Color()),

    lamp: lerp(a[12], b[12], s)

function phaseName(t){
  t = ((t % 1) + 1) % 1;
  for(const [lim, name] of PHASE_NAMES) if(t < lim) return name;
  return 'РАССВЕТ';
}
/** Часы и минуты условных суток: 0.25 — полдень, 0.75 — полночь. */
function dayClock(t){
  const hours = (((t % 1) + 1) % 1) * 24 + 6;   // t=0 соответствует 06:00
  const h = Math.floor(hours) % 24, m = Math.floor((hours % 1) * 60);
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

let _lastShadowDir = new THREE.Vector3(9,9,9);
/** Пересчёт всей световой обстановки под текущее время суток. */
function applyDaylight(t){
  const k = sampleDay(t);
  // Солнце ходит по наклонной дуге: ось восход-закат развёрнута поперёк
  // конька, поэтому полосы света из проёмов кровли ползут по полу.
  // Светлое время занимает 0..DUSK, ночь — остаток суток, поэтому шкала
  // разбита на два участка: иначе солнце садилось бы уже в «вечер»,
  // когда по таблице ключей оно ещё должно светить.
  const DUSK = 0.66, NOON = 0.25;
  let elev, azim;
  if(t < DUSK){
    // u: 0 — восход, 0.5 — полдень, 1 — заход
    const u = t < NOON ? 0.5*(t/NOON) : 0.5 + 0.5*((t-NOON)/(DUSK-NOON));
    elev = Math.sin(Math.PI*u);
    azim = -Math.cos(Math.PI*u);
  } else {
    const v = (t - DUSK)/(1 - DUSK);
    elev = -0.92*Math.sin(Math.PI*v);
    azim = Math.cos(Math.PI*v);
  }
  SUN_ELEV = elev;
  SUN_DIR.set(azim*0.86, Math.max(elev, -1), -azim*0.34 - 0.22*elev).normalize();
  const R = 96;
  sun.position.copy(SUN_DIR).multiplyScalar(R).add(sunTarget.position);
  sun.color.copy(k.sunCol);
  sun.intensity = k.sunI;
  sun.visible = k.sunI > 0.004;
  sun.castShadow = sun.visible && elev > -0.02;

  // Луна противостоит солнцу и светит только когда солнце за горизонтом.
  MOON_DIR.copy(SUN_DIR).negate();
  const moonUp = clamp(MOON_DIR.y, 0, 1);
  const nightK = smoothstep(0.06, -0.14, elev);          // 0 днём, 1 ночью
  moon.position.copy(MOON_DIR).multiplyScalar(R).add(sunTarget.position);
  moon.intensity = 0.34 * nightK * smoothstep(0.0, 0.35, moonUp);
  moon.visible = moon.intensity > 0.004;

  hemi.color.copy(k.hemiSky); hemi.groundColor.copy(k.hemiGnd);
  hemi.intensity = lerp(0.70, 0.11, nightK);
  ambient.intensity = k.amb;
  const fillBase = [0.50, 0.34, 0.28, 0.55];
  FILLS.forEach((f,i)=> f.intensity = fillBase[i] * lerp(1.0, 0.06, nightK));

  // небо
  skyUniforms.uTop.value.copy(k.skyTop);
  skyUniforms.uMid.value.copy(k.skyMid);
  skyUniforms.uBot.value.copy(k.skyBot);
  skyUniforms.uSunDir.value.copy(SUN_DIR);
  skyUniforms.uSunCol.value.copy(k.sunCol);
  skyUniforms.uHaze.value = lerp(0.30, 1.0, smoothstep(0.35, 0.0, Math.abs(elev)));
  skyUniforms.uStars.value = smoothstep(0.0, 0.9, nightK);
  skyUniforms.uMoonDir.value.copy(MOON_DIR);
  skyUniforms.uMoon.value = nightK * smoothstep(-0.05, 0.3, MOON_DIR.y);

  scene.fog.color.copy(k.fogCol);
  scene.fog.density = k.fogD;
  scene.background = k.fogCol;
  scene.environmentIntensity = lerp(1.0, 0.10, nightK);
  renderer.toneMappingExposure = k.exp;

  // Стёкла темнеют к ночи, но подсвечиваются изнутри, когда горят фонари.
  M.glass.color.copy(k.skyMid).lerp(_kc.setHex(0xc4cfd6), 1-nightK*0.86);
  M.glass.emissiveIntensity = lerp(0.42, 0.12, nightK);

  // Столбы света и пылинки живут только при солнце.
  const shaftK = clamp(k.sunI/4.2, 0, 1) * smoothstep(-0.02, 0.22, elev);
  const shaftsOn = shaftK > 0.02;
  shaftMat.uniforms.uOpacity.value = 0.058 * shaftK;
  SPOT_MAT.opacity = 0.075 * shaftK;
  for(const s of SHAFTS) s.visible = shaftsOn;
  if(shaftsOn) updateShafts();
  else for(const s of SPOT_POOL) s.mesh.visible = false;
  if(dust) dust.material.uniforms.uOpacity.value = lerp(0.44, 0.09, nightK);

  LAMP_LEVEL = k.lamp;
  setLampGlow(k.lamp);
  setNightGlow(k.lamp);
  NIGHT = nightK > 0.5;

  // Ночью лампы должны «цвести», днём ореол только пачкает картинку.
  if(bloomPass){
    bloomPass.strength  = lerp(0.24, 0.62, k.lamp);
    bloomPass.threshold = lerp(0.98, 0.62, k.lamp);
  }
  // Холодные тени днём, тёплые от натриевых ламп ночью.
  if(gradePass){
    gradePass.uniforms.uShadowTint.value.setRGB(
      lerp(0.78, 0.62, nightK), lerp(0.84, 0.70, nightK), lerp(0.98, 1.02, nightK));
    gradePass.uniforms.uHighTint.value.setRGB(
      lerp(1.06, 1.12, nightK), lerp(1.00, 0.96, nightK), lerp(0.90, 0.80, nightK));
    gradePass.uniforms.uVig.value = lerp(0.18, 0.34, nightK);
    gradePass.uniforms.uSat.value = lerp(1.04, 0.92, nightK);
  }

  // Карта теней перерисовывается, когда солнце заметно ушло: на слабой
  // машине ежекадровый проход теней стоит дороже всей остальной сцены.
  if(renderer.shadowMap.enabled && SUN_DIR.distanceToSquared(_lastShadowDir) > 2e-5){
    renderer.shadowMap.needsUpdate = true;
    _lastShadowDir.copy(SUN_DIR);
  }
}
/** Совместимость с прежним переключателем: прыжок на полдень или полночь. */
function setNight(on){ DAY_T = on ? 0.82 : 0.25; applyDaylight(DAY_T); }

const PROPS = new THREE.Group(); 
/** Зоны, которые реквизит занимать не должен: марши и проёмы лестниц. */
const NOPROP = [

  // схода, иначе реквизит второго этажа нависает над маршем и перекрывает

  {x0: 11.8, z0:-9.4, x1: 15.4, z1:-2.0},    // правая лестница + проём
  {x0: -4.2, z0: 5.6, x1:  3.6, z1: 9.6},    // южная внутренняя лестница
  {x0: -9.4, z0:-13.0, x1:-7.4, z1:-9.4},    // наружные лестницы у фасадов
  {x0:  7.4, z0:-13.0, x1: 12.6, z1:-9.4},
