/** Список маршей для автопроверки: начало, направление подъёма и длина. */
const STAIRWAYS = [];
function registerStair(x,z,dir,run,y1,width=1.7){
  STAIRWAYS.push({x,z,dir,run,y1});
  // Габарит марша в плане: по оси подъёма — длина плюс площадка схода,
  // поперёк — ширина. Сюда не ставится ни опора перекрытия, ни реквизит.
  const sign = (dir==='+x'||dir==='+z') ? 1 : -1;
  const w = width/2 + 0.2;
  if(dir==='+x'||dir==='-x') keepOut(x - 0.8*sign, z-w, x + sign*(run+0.8), z+w);
  else                        keepOut(x-w, z - 0.8*sign, x+w, z + sign*(run+0.8));
}
/** Проверка проходимости маршей: тело ведут по оси лестницы и смотрят,
    удаётся ли подняться на проектную отметку. Возвращает список проблем. */
function auditStairs(){
  const issues = [];
  const saveP = PL.pos.clone(), saveV = PL.vel.clone(), saveY = PL.yaw, saveF = PL.fly;
  for(const s of STAIRWAYS){
    const sign = (s.dir==='+x'||s.dir==='+z') ? 1 : -1;
    const along = (s.dir==='+x'||s.dir==='-x') ? 'x' : 'z';
    // Низ марша всегда в (x,z): и наружные, и внутренние лестницы строятся
    // снизу вверх. Стартуем на полшага раньше низа и идём по оси подъёма.
    PL.fly = false; PL.vel.set(0,0,0);
    PL.pos.set(along==='x' ? s.x - sign*0.5 : s.x, 0.06,
               along==='z' ? s.z - sign*0.5 : s.z);
    // yaw: 0 смотрит в -z, PI в +z, -PI/2 в +x, PI/2 в -x
    PL.yaw = along==='x' ? (sign>0 ? -Math.PI/2 : Math.PI/2) : (sign>0 ? Math.PI : 0);
    depenetrate();
    let top = PL.pos.y;
    for(let i=0;i<720;i++){ keys['KeyW']=true; update(1/60); top = Math.max(top, PL.pos.y); }
    keys['KeyW']=false;
    if(top < s.y1 - 0.30)
      issues.push({stair:`${s.dir} @${s.x.toFixed(1)},${s.z.toFixed(1)}`,
                   reached:+top.toFixed(2), expected:+s.y1.toFixed(2)});
  }
  PL.pos.copy(saveP); PL.vel.copy(saveV); PL.yaw = saveY; PL.fly = saveF;
  if(issues.length) console.warn('Лестницы непроходимы:', issues);
  return issues;
}
const _near=[];
function nearCol(x,z,pad){
  _near.length=0;
  const seen=new Set();
  for(let ix=Math.floor((x-pad)/CELL); ix<=Math.floor((x+pad)/CELL); ix++)
    for(let iz=Math.floor((z-pad)/CELL); iz<=Math.floor((z+pad)/CELL); iz++){
      const arr=GRID.get(gkey(ix,iz)); if(!arr) continue;
      for(const i of arr) if(!seen.has(i)){ seen.add(i); _near.push(COLLIDERS[i]); }
    }
  return _near;
}
const STEP_UP = 0.46;
function overlaps(x,y,z,r,h){
  for(const c of nearCol(x,z,r+0.6)){
    // Ступени маршей помечены step: они работают только как опора под ноги.
    // Иначе ростовое тело, стоящее на одной ступени, всегда пересекает
    // следующие и подъём по лестнице становится невозможен.
    if(c.step && y >= c.y1 - 0.02) continue;
    if(x+r<=c.x0||x-r>=c.x1) continue;
    if(z+r<=c.z0||z-r>=c.z1) continue;
    if(y+h<=c.y0||y>=c.y1) continue;
    return c;
  }
  return null;
}
/** Пересечение тела, при котором пол под ногами не считается преградой.
    Нужно при подъёме по лестнице: вставая на ступень, игрок телом всё ещё
    пересекает следующую, и без этого правила марш непроходим. */
function overlapsAbove(x,y,z,r,h,floorY){
  for(const c of nearCol(x,z,r+0.6)){
    if(c.step) continue;
    if(c.y1 <= floorY + 0.001) continue;          // это опора, а не стена
    if(x+r<=c.x0||x-r>=c.x1) continue;
    if(z+r<=c.z0||z-r>=c.z1) continue;
    if(y+h<=c.y0||y>=c.y1) continue;
    // Ступень, на которую можно просто шагнуть дальше, тоже не преграда.
    if(c.y1 - floorY <= STEP_UP) continue;
    return c;
  }
  return null;
}
/** Габариты тела в текущем режиме: пешком — ростовая капсула, в полёте —
    компактная сфера, иначе в дверные проёмы не пролететь. */
function body(){ return PL.fly ? BODY.fly : BODY.walk; }
/** Пересечение тела с геометрией в точке (x,y,z), где y — отметка PL.pos. */
function hits(x,y,z){ const b=body(); return overlaps(x, y+b.off, z, b.r, b.h); }
/** Высота, на которую надо подняться, чтобы преодолеть препятствие в точке.
    Возвращает -1, если хоть одна преграда выше допустимого шага. */
function stepTarget(x,y,z,r,h){
  let top=-1;
  for(const c of nearCol(x,z,r+0.6)){
    if(x+r<=c.x0||x-r>=c.x1) continue;
    if(z+r<=c.z0||z-r>=c.z1) continue;
    if(y+h<=c.y0||y>=c.y1) continue;
    if(c.y1-y > STEP_UP) return -1;
    if(c.y1>top) top=c.y1;
  }
  return top;
}
/** Движение по одной горизонтальной оси. Шаг дробится: на скорости 40 м/с
    за кадр набегает больше метра, и цельный шаг проскакивал бы сквозь стену. */
function moveAxis(axis,d){
  if(Math.abs(d)<1e-6 || NOCLIP){
    if(NOCLIP){ if(axis===0) PL.pos.x+=d; else PL.pos.z+=d; }
    return;
  }
  const b = body(), p = PL.pos;
  const n = Math.min(24, Math.max(1, Math.ceil(Math.abs(d)/(b.r*0.5))));
  const dd = d/n;
  for(let i=0;i<n;i++){
    const stuck = !!hits(p.x,p.y,p.z);
    const nx = axis===0 ? p.x+dd : p.x, nz = axis===2 ? p.z+dd : p.z;
    if(!hits(nx,p.y,nz) || stuck){ if(axis===0) p.x=nx; else p.z=nz; continue; }
    if(PL.fly){ if(axis===0) PL.vel.x=0; else PL.vel.z=0; return; }
    // пешком: пробуем перешагнуть низкое препятствие
    const top = stepTarget(nx,p.y,nz,b.r,b.h);
    // Проверку свободы над ступенью ведём относительно новой отметки пола:
    // иначе следующая ступень марша сама себя объявляет стеной и лестница
    // становится непроходимой примерно на середине.
    if(top > p.y+0.001 && !overlapsAbove(nx, top+0.03+b.off, nz, b.r, b.h, top+0.02)){
      p.y = top+0.03; if(axis===0) p.x=nx; else p.z=nz;
      PL.onGround=true; PL.vel.y=Math.max(PL.vel.y,0);
    } else { if(axis===0) PL.vel.x=0; else PL.vel.z=0; return; }
  }
}
/** Вертикальное движение с тем же дроблением — для полёта и прыжка. */
function moveY(d){
  if(Math.abs(d)<1e-6) return;
  if(NOCLIP){ PL.pos.y+=d; return; }
  const b = body(), p = PL.pos;
  const n = Math.min(24, Math.max(1, Math.ceil(Math.abs(d)/(b.h*0.45))));
  const dd = d/n;
  for(let i=0;i<n;i++){
    const stuck = !!hits(p.x,p.y,p.z);
    const ny = p.y+dd;
    if(!hits(p.x,ny,p.z) || stuck) p.y = ny;
    else { PL.vel.y = 0; return; }
  }
}
/** Выталкивание из геометрии по кратчайшей оси. Нужен после телепортаций,
    смены режима и застреваний в щелях между смежными коллайдерами. */
function depenetrate(){
  if(NOCLIP) return;
  const b = body(), p = PL.pos;
  for(let i=0;i<4;i++){
    const c = hits(p.x,p.y,p.z);
    if(!c) return;
    const by = p.y + b.off;
    const cand = [
      [(c.x1+b.r)-p.x, 'x+'], [p.x-(c.x0-b.r), 'x-'],
      [(c.z1+b.r)-p.z, 'z+'], [p.z-(c.z0-b.r), 'z-']
    ];
    const up = (c.y1+0.02) - by, down = (by+b.h) - (c.y0-0.02);
    if(PL.fly){ cand.push([up,'y+'], [down,'y-']); }
    else if(up <= STEP_UP) cand.push([up,'y+']);
    let best = Infinity, mode = null;
    for(const [v,m] of cand) if(v >= 0 && v < best){ best = v; mode = m; }
    if(!mode) return;
    if(mode==='x+')      p.x = c.x1 + b.r + 0.001;
    else if(mode==='x-') p.x = c.x0 - b.r - 0.001;
    else if(mode==='z+') p.z = c.z1 + b.r + 0.001;
    else if(mode==='z-') p.z = c.z0 - b.r - 0.001;
    else if(mode==='y+') p.y = c.y1 - b.off + 0.02;
    else                 p.y = c.y0 - b.off - b.h - 0.02;
  }
}
function groundH(x,z,yFrom){
  let best=0;
  const r = BODY.walk.r;
  for(const c of nearCol(x,z,r+0.5)){
    if(x+r<=c.x0||x-r>=c.x1) continue;
    if(z+r<=c.z0||z-r>=c.z1) continue;
    if(c.y1<=yFrom+0.35 && c.y1>best) best=c.y1;
  }
  return best;
}

addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(['Space','KeyW','KeyA','KeyS','KeyD','ControlLeft','Tab'].includes(e.code)) e.preventDefault();
  if(e.code==='KeyG'){
    PL.fly=!PL.fly; PL.vel.set(0,0,0);
    // Габарит тела меняется вместе с режимом: после переключения можно
    // оказаться внутри перекрытия, поэтому сразу выталкиваемся наружу.
    depenetrate();
  }
  if(e.code==='KeyV'){ NOCLIP=!NOCLIP; if(!NOCLIP) depenetrate(); }
  // Управление временем: N перескакивает по фазам, скобки меняют скорость,
  // P останавливает часы — так удобно рассматривать конкретное освещение.
  if(e.code==='KeyN'){
    const marks = [0.25, 0.52, 0.60, 0.68, 0.80, 0.98];
    const next = marks.find(m => m > DAY_T + 0.004);
    DAY_T = next === undefined ? marks[0] : next;
    applyDaylight(DAY_T);
  }
  if(e.code==='KeyP') DAY_PAUSED = !DAY_PAUSED;
  if(e.code==='BracketLeft')  DAY_SPEED = Math.max(1/3600, DAY_SPEED/1.8);
  if(e.code==='BracketRight') DAY_SPEED = Math.min(1/12, DAY_SPEED*1.8);
  if(e.code==='F3'){ e.preventDefault(); const f=$('#fps'); f.style.display = f.style.display==='none'?'block':'none'; }
});

const fwd = new THREE.Vector3(), right = new THREE.Vector3(), tmp = new THREE.Vector3();
function update(dt){
  const boost = (keys['ShiftLeft']||keys['ShiftRight']) ? 3.0 : (keys['AltLeft']||keys['AltRight']) ? 0.28 : 1;
  fwd.set(-Math.sin(PL.yaw),0,-Math.cos(PL.yaw));
  right.set(Math.cos(PL.yaw),0,-Math.sin(PL.yaw));
  let ix=0, iz=0;
  if(keys['KeyW']) iz+=1; if(keys['KeyS']) iz-=1;
  if(keys['KeyD']) ix+=1; if(keys['KeyA']) ix-=1;
  if(ix||iz){ const l=Math.hypot(ix,iz); ix/=l; iz/=l; }

  if(PL.fly){
    const look = new THREE.Vector3(
      -Math.sin(PL.yaw)*Math.cos(PL.pitch), Math.sin(PL.pitch), -Math.cos(PL.yaw)*Math.cos(PL.pitch));
    const sp = PL.speed*boost;
    tmp.set(0,0,0).addScaledVector(look, iz*sp).addScaledVector(right, ix*sp);
    if(keys['Space']) tmp.y += sp;
    if(keys['ControlLeft']||keys['ControlRight']) tmp.y -= sp;
    // плавное ускорение — полёт «как тень», без рывков
    PL.vel.lerp(tmp, Math.min(1, dt*7.5));
    // Полёт тоже упирается в геометрию: стены, перекрытия и техника твёрдые.
    moveAxis(0, PL.vel.x*dt); moveAxis(2, PL.vel.z*dt); moveY(PL.vel.y*dt);
    depenetrate();
    PL.pos.x = clamp(PL.pos.x, -HW-6, HW+6);
    PL.pos.z = clamp(PL.pos.z, -HD-6, HD+6);
    // ниже пола не опускаемся: под бетоном смотреть нечего
    PL.pos.y = clamp(PL.pos.y, 0.25, RIDGE+14);
  } else {
    const sp = 3.6*boost;
    tmp.set(0,0,0).addScaledVector(fwd, iz*sp).addScaledVector(right, ix*sp);
    const acc = PL.onGround ? 13 : 3;
    PL.vel.x += (tmp.x-PL.vel.x)*Math.min(1,acc*dt);
    PL.vel.z += (tmp.z-PL.vel.z)*Math.min(1,acc*dt);
    PL.vel.y -= 19*dt;
    if(keys['Space'] && PL.onGround && !PL.jl){ PL.vel.y=6.0; PL.onGround=false; PL.jl=true; }
    if(!keys['Space']) PL.jl=false;
    moveAxis(0, PL.vel.x*dt); moveAxis(2, PL.vel.z*dt);
    depenetrate();
    PL.pos.y += PL.vel.y*dt;
    const gh = groundH(PL.pos.x, PL.pos.z, PL.pos.y);
    if(PL.vel.y<=0 && PL.pos.y<=gh+0.001){ PL.pos.y=gh; PL.vel.y=0; PL.onGround=true; }
    else {
      PL.onGround=false;
      const up = hits(PL.pos.x,PL.pos.y,PL.pos.z);
      if(up && PL.vel.y>0 && up.y0>PL.pos.y){ PL.pos.y=up.y0-PL.h-0.01; PL.vel.y=0; }
    }
    if(PL.pos.y < -8){ PL.pos.set(-35,1.66,-26); PL.vel.set(0,0,0); }
  }

  camera.position.set(PL.pos.x, PL.pos.y + (PL.fly?0:PL.eye), PL.pos.z);
  camera.rotation.set(0,0,0, 'YXZ');
  camera.rotation.order = 'YXZ';
  camera.rotation.y = PL.yaw; camera.rotation.x = PL.pitch;
  updateLightPool(PL.pos);
}

/* ============================================================================
   ПОСТОБРАБОТКА: чистое кино, без bodycam. Только тонмаппинг-грейд и SMAA.
============================================================================ */
const GradeShader = {
  uniforms:{
    tDiffuse:{value:null}, uVig:{value:0.18}, uSat:{value:1.04},
    uShadowTint:{value:new THREE.Color(0.78,0.84,0.98)},   // холодные тени
    uHighTint:{value:new THREE.Color(1.06,1.00,0.90)},     // тёплые света
    uLift:{value:0.016}, uContrast:{value:1.12}, uTemp:{value:0.0}
  },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform float uVig,uSat,uLift,uContrast,uTemp;
    uniform vec3 uShadowTint, uHighTint;
    varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec3 col = max(c.rgb, 0.0);

      // подъём чёрного: «плёночный» чёрный вместо провала в ноль
      col = col + uLift*(1.0 - col);

      // S-кривая контраста вокруг средней точки
      col = clamp((col - 0.5)*uContrast + 0.5, 0.0, 1.0);

      // Раздельная тонировка с сохранением яркости: тени холоднее, света теплее,
      // но общая экспозиция не падает (иначе картинка уходит в мутную оливку).
      float l = dot(col, vec3(0.2126,0.7152,0.0722));
      vec3 tint = mix(uShadowTint, uHighTint, smoothstep(0.06, 0.70, l));
      tint /= max(dot(tint, vec3(0.2126,0.7152,0.0722)), 1e-4);
      col *= mix(vec3(1.0), tint, 0.30);

      col = mix(vec3(dot(col, vec3(0.2126,0.7152,0.0722))), col, uSat);

      // мягкая широкая виньетка
      vec2 d = vUv - 0.5;
      col *= clamp(1.0 - uVig*dot(d,d)*1.9, 0.0, 1.0);

      gl_FragColor = vec4(col, c.a);
    }`
};
let composer, bloomPass, gradePass, smaaPass, aoPass;
function buildComposer(){
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  // Ambient occlusion: без контактных теней стыки стен/пола выглядят плоско.
  // Проход дорогой, поэтому на слабых профилях его заменяет запечённый AO
  // из карт высот — он уже есть у всех основных материалов.
  if(Q.ao){
    aoPass = new GTAOPass(scene, camera, innerWidth, innerHeight);
    aoPass.output = GTAOPass.OUTPUT.Default;
    aoPass.updateGtaoMaterial({
      radius: 0.42, distanceExponent: 1.6, thickness: 0.6,
      scale: 1.1, samples: QNAME==='ultra' ? 16 : 10, screenSpaceRadius: false
    });
    aoPass.updatePdMaterial({ lumaPhi: 8, depthPhi: 2.2, normalPhi: 3.6, radius: 4, samples: 8 });
    aoPass.blendIntensity = 1.0;
    composer.addPass(aoPass);
  }
  if(Q.bloom){
    // Ночью ореол вокруг ламп — главный носитель настроения, поэтому
    // порог ниже дневного и подстраивается в applyDaylight.
    bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.28, 0.85, 0.98);
    composer.addPass(bloomPass);
  }
  gradePass = new ShaderPass(GradeShader);
  composer.addPass(gradePass);
  if(Q.smaa){
    smaaPass = new SMAAPass(innerWidth*renderer.getPixelRatio(), innerHeight*renderer.getPixelRatio());
    composer.addPass(smaaPass);
  }
  composer.addPass(new OutputPass());
}

const clock = new THREE.Clock();
let fpsAcc=0, fpsN=0, fpsT=0;
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  const t = performance.now()/1000;
  if(!DAY_PAUSED){
    DAY_T = (DAY_T + dt*DAY_SPEED) % 1;
    applyDaylight(DAY_T);
  }
  shaftMat.uniforms.uTime.value = t;
  if(dust) dust.material.uniforms.uTime.value = t;
  updateFlicker(t);
  animatePOI(t, dt);
  stepPhysics(dt, t);
  composer.render();
  fpsAcc += 1/Math.max(dt,1e-4); fpsN++; fpsT += dt;
  if(fpsT > 0.5){
    const fps = fpsAcc/fpsN;
    autoScale(fps);
    const el = $('#fps');
    if(el.style.display !== 'none'){
      el.textContent = `${fps.toFixed(0)} fps · ${renderer.info.render.calls} calls · `
        + `${(renderer.info.render.triangles/1000).toFixed(0)}k tris · ${QNAME}`
        + ` · ${dayClock(DAY_T)} ${phaseName(DAY_T)}`
        + ` · ${PL.pos.x.toFixed(0)},${PL.pos.y.toFixed(1)},${PL.pos.z.toFixed(0)} · v${PL.speed.toFixed(1)}`;
    }
    fpsAcc=0; fpsN=0; fpsT=0;
  }
}
/* Динамическое разрешение: если кадр устойчиво не дотягивает до цели,
   рендер идёт в меньший буфер, а при запасе возвращается к исходному.
   Геометрия и свет при этом не меняются — качество картинки сохраняется. */
let _scale = 1, _slow = 0, _fast = 0;
function autoScale(fps){
  if(!composer) return;
  const target = Q.target;
  if(fps < target*0.82){ _slow++; _fast=0; } else if(fps > target*1.12){ _fast++; _slow=0; }
  else { _slow=0; _fast=0; return; }
  let next = _scale;
  if(_slow >= 2) next = Math.max(0.62, _scale - 0.10);
  if(_fast >= 6) next = Math.min(1.0, _scale + 0.06);
  if(Math.abs(next-_scale) < 0.005) return;
  _scale = next; _slow = 0; _fast = 0;
  renderer.setPixelRatio(Math.min(devicePixelRatio, Q.pixelRatio) * _scale);
  composer.setSize(innerWidth, innerHeight);
  if(aoPass) aoPass.setSize(innerWidth, innerHeight);
}
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  if(aoPass) aoPass.setSize(innerWidth, innerHeight);
  if(smaaPass) smaaPass.setSize(innerWidth*renderer.getPixelRatio(), innerHeight*renderer.getPixelRatio());
});

    step: dt => update(dt), setNight,
    quality: QNAME, presets: Object.keys(QPRESETS),
    time:{ get t(){ return DAY_T; }, set:(v)=>{ DAY_T=((v%1)+1)%1; applyDaylight(DAY_T); },
           get phase(){ return phaseName(DAY_T); }, get clock(){ return dayClock(DAY_T); },
           get paused(){ return DAY_PAUSED; }, pause:(v)=>{ DAY_PAUSED=!!v; },
           get speed(){ return DAY_SPEED; }, setSpeed:(v)=>{ DAY_SPEED=v; } },
    bounds:{hw:HW, hd:HD, eave:EAVE, ridge:RIDGE}, floors:{ground:0, deck:F2+DECK_T},
    building:{x0:BX0, x1:BX1, z0:BZ0, z1:BZ1, atrium:ATR, extDoors:EXT_DOORS},
    stats:{graffiti:GRAF_COUNT, posters:POSTER_COUNT, lamps:LAMPS.length,
           shafts:SHAFTS.length, walls:WALLSEGS.length, poi:POI.length,
           bakedCalls, fragments:BREAKABLE.length, cloths:CLOTHS.length,
           stairs:STAIRWAYS.length, stairIssues},
    physics:{ wind:WIND, cloths:CLOTHS, rigid:RIGID, breakable:BREAKABLE,
              damage:(o,d,p)=>damageAt(o,d,p) }
  };
  $('#g_load').style.display = 'none';
  $('#g_ready').style.display = 'block';
  $('#g_q').textContent = `качество: ${QNAME} · ?q=low|med|high|ultra`;
  $('#g_go').onclick = ()=> renderer.domElement.requestPointerLock();
  loop();
}
try{ build(); }
catch(err){
  console.error(err);
  $('#g_load').innerHTML = '<p style="color:#d9736b">Ошибка: '+String(err&&err.message||err)+'</p>';
}
</script>
</body>
</html>
